      },
      onComplete: () => txt.destroy()
    });
  }
  function updateCombat(dt) {
    _units = _units.filter((u) => !u.dead);
    if (!_battleStarted) return;
    for (const u of _units) {
      const opponents = _units.filter((o) => o.side !== u.side);
      const inRange = opponents.filter((o) => Math.hypot(o.x - u.x, o.y - u.y) <= u.def.range);
      if (inRange.length > 0) {
        u.fireTimer -= dt;
        if (u.fireTimer <= 0) {
          u.fireTimer += Math.max(u.def.interval, 0.05);
          const target = inRange[Math.floor(Math.random() * inRange.length)];
          const mult = getRpsMultiplier(u.def.combatType, target.def.combatType);
          const dmg = u.def.dmg * mult;
          target.hp -= dmg;
          showDmg(target.x, target.y, dmg, target.side === "ally");
          if (target.hp <= 0) killUnit(target);
        }
      } else if (opponents.length > 0) {
        let nearest = opponents[0];
        let nearDist = Math.hypot(opponents[0].x - u.x, opponents[0].y - u.y);
        for (const o of opponents) {
          const d2 = Math.hypot(o.x - u.x, o.y - u.y);
          if (d2 < nearDist) {
            nearDist = d2;
            nearest = o;
          }
        }
        const dx = nearest.x - u.x, dy = nearest.y - u.y;
        const d = Math.hypot(dx, dy);
        u.x += dx / d * u.def.speed * dt;
        u.y += dy / d * u.def.speed * dt;
        u.arc.setPosition(u.x, u.y);
      } else {
        const dx = ARENA_CX - u.x, dy = ARENA_CY - u.y;
        const d = Math.hypot(dx, dy);
        if (d > 20) {
          u.x += dx / d * u.def.speed * 0.25 * dt;
          u.y += dy / d * u.def.speed * 0.25 * dt;
          u.arc.setPosition(u.x, u.y);
        }
      }
    }
  }
  function applySeparation() {
    const SEP_GAP = 5;
    const n = _units.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = _units[i], b = _units[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1e-3;
        const minDist = a.def.radius + b.def.radius + SEP_GAP;
        if (dist < minDist) {
          const push = (minDist - dist) * 0.5;
          const nx = dx / dist, ny = dy / dist;
          a.x -= nx * push;
          a.y -= ny * push;
          b.x += nx * push;
          b.y += ny * push;
          a.arc.setPosition(a.x, a.y);
          b.arc.setPosition(b.x, b.y);
        }
      }
    }
  }
  function updateLabels() {
    for (const u of _units) {
      u.rpsLabel.setPosition(u.x, u.y + u.def.radius + 9);
    }
  }
  function drawHPBars() {
    _hpGfx.clear();
    for (const u of _units) {
      if (u.dead) continue;
      const bw = u.def.radius * 4;
      const bh = u.def.radius > 14 ? 6 : 4;
      const bx = u.x - bw / 2, by = u.y - u.def.radius - 9;
      const frac = Math.max(0, u.hp / u.def.hp);
      _hpGfx.fillStyle(0, 0.6);
      _hpGfx.fillRect(bx, by, bw, bh);
      _hpGfx.fillStyle(frac > 0.6 ? 4513092 : frac > 0.3 ? 16768290 : 16729122, 1);
      _hpGfx.fillRect(bx, by, bw * frac, bh);
      u.hpText.setText(String(Math.ceil(Math.max(0, u.hp))));
      u.hpText.setPosition(u.x, by - 1);
    }
  }
  function refreshCounters() {
    const counts = {};
    for (const u of _units) {
      if (!u.dead) counts[u.typeName] = (counts[u.typeName] ?? 0) + 1;
    }
    for (const [k, txt] of Object.entries(_countTexts)) txt.setText(String(counts[k] ?? 0));
    const a = _units.filter((u) => !u.dead && u.side === "ally").length;
    const e = _units.filter((u) => !u.dead && u.side === "enemy").length;
    _statsText.setText(`Allies: ${a}   Enemies: ${e}`);
  }
  function buildPanel() {
    const s = _scene;
    const sf = 0;
    s.add.rectangle(PANEL_W / 2, H / 2, PANEL_W, H, 789784).setScrollFactor(sf).setDepth(10);
    const bg = s.add.graphics().setScrollFactor(sf).setDepth(10);
    bg.lineStyle(1, 3359846, 0.9);
    bg.lineBetween(PANEL_W, 0, PANEL_W, H);
    s.add.text(
      PANEL_W / 2,
      8,
      "COMBAT TEST",
      { color: "#5599cc", fontFamily: "monospace", fontSize: "11pt", fontStyle: "bold" }
    ).setOrigin(0.5, 0).setScrollFactor(sf).setDepth(11);
    _statsText = s.add.text(
      PANEL_W + 10,
      8,
      "",
      { color: "#556677", fontFamily: "monospace", fontSize: "10pt" }
    ).setScrollFactor(sf).setDepth(11);
    let py = 36;
    const divider = () => {
      const dg = s.add.graphics().setScrollFactor(sf).setDepth(10);
      dg.lineStyle(1, 3359829, 0.45);
      dg.lineBetween(10, py, PANEL_W - 10, py);
      py += 8;
    };
    const sectionLabel = (text, color) => {
      s.add.text(10, py, text, { color, fontFamily: "monospace", fontSize: "9pt" }).setScrollFactor(sf).setDepth(11);
      py += 18;
    };
    const unitRow = (typeName, def, side) => {
      const ry = py;
      s.add.arc(16, ry + 12, def.radius - 1, 0, 360, false, def.color).setScrollFactor(sf).setDepth(11);
      s.add.text(32, ry + 4, def.label, { color: "#9aabb8", fontFamily: "monospace", fontSize: "10pt" }).setScrollFactor(sf).setDepth(11);
      s.add.text(32, ry + 17, rpsSymbol(def.combatType), {
        color: rpsColor(def.combatType),
        fontFamily: "monospace",
        fontSize: "7.5pt"
      }).setScrollFactor(sf).setDepth(11);
      _countTexts[typeName] = s.add.text(114, ry + 5, "0", { color: "#ffdd88", fontFamily: "monospace", fontSize: "10pt" }).setScrollFactor(sf).setDepth(11);
      const mBg = s.add.rectangle(143, ry + 12, 24, 18, 1837064).setStrokeStyle(1, 6697779).setScrollFactor(sf).setDepth(11).setInteractive({ useHandCursor: true });
      s.add.text(143, ry + 12, "\u2212", { color: "#ff8888", fontFamily: "monospace", fontSize: "11pt" }).setOrigin(0.5).setScrollFactor(sf).setDepth(12);
      mBg.on("pointerdown", (_, __, ___, ev) => {
        ev.stopPropagation();
        const live = _units.filter((u) => !u.dead && u.side === side && u.typeName === typeName);
        if (live.length) killUnit(live[live.length - 1]);
      });
      const pBg = s.add.rectangle(173, ry + 12, 24, 18, 531464).setStrokeStyle(1, 3368499).setScrollFactor(sf).setDepth(11).setInteractive({ useHandCursor: true });
      s.add.text(173, ry + 12, "+", { color: "#88ff88", fontFamily: "monospace", fontSize: "11pt" }).setOrigin(0.5).setScrollFactor(sf).setDepth(12);
      pBg.on("pointerdown", (_, __, ___, ev) => {
        ev.stopPropagation();
        spawnUnit(side, typeName);
      });
      py += 28;
    };
    sectionLabel("\u2500\u2500\u2500 ALLIES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "#3d5fa0");
    for (const [k, def] of Object.entries(ALLY_DEFS)) unitRow(k, def, "ally");
    divider();
    sectionLabel("\u2500\u2500\u2500 ENEMIES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "#a04030");
    for (const [k, def] of Object.entries(ENEMY_DEFS2)) unitRow(k, def, "enemy");
    py += 8;
    const clearBg = s.add.rectangle(PANEL_W / 2, py + 13, PANEL_W - 20, 24, 1706506).setStrokeStyle(1, 6702148).setScrollFactor(sf).setDepth(11).setInteractive({ useHandCursor: true });
    s.add.text(PANEL_W / 2, py + 13, "CLEAR ALL", { color: "#ff6655", fontFamily: "monospace", fontSize: "10pt" }).setOrigin(0.5).setScrollFactor(sf).setDepth(12);
    clearBg.on("pointerdown", (_, __, ___, ev) => {
      ev.stopPropagation();
      resetBattle();
      clearAll();
    });
    py += 20;
    const sepG = s.add.graphics().setScrollFactor(sf).setDepth(10);
    sepG.lineStyle(1, 3359829, 0.5);
    sepG.lineBetween(10, py, PANEL_W - 10, py);
    py += 20;
    _startBattleBtn = s.add.rectangle(58, py + 13, 95, 26, 666122).setStrokeStyle(1, 4500036).setScrollFactor(sf).setDepth(11).setInteractive({ useHandCursor: true });
    _startBattleTxt = s.add.text(58, py + 13, "START", {
      color: "#88ff88",
      fontFamily: "monospace",
      fontSize: "9pt",
      fontStyle: "bold"
    }).setOrigin(0.5).setScrollFactor(sf).setDepth(12);
    _startBattleBtn.on("pointerdown", (_, __, ___, ev) => {
      ev.stopPropagation();
      startBattle();
    });
    _resetBtn = s.add.rectangle(162, py + 13, 95, 26, 1709328).setStrokeStyle(1, 4469538).setScrollFactor(sf).setDepth(11).setInteractive({ useHandCursor: true });
    _resetTxt = s.add.text(162, py + 13, "RESET", {
      color: "#554433",
      fontFamily: "monospace",
      fontSize: "9pt",
      fontStyle: "bold"
    }).setOrigin(0.5).setScrollFactor(sf).setDepth(12);
    _resetBtn.on("pointerdown", (_, __, ___, ev) => {
      ev.stopPropagation();
      resetBattle();
    });
    py += 36;
    py += 10;
    const ig = s.add.graphics().setScrollFactor(sf).setDepth(10);
    ig.lineStyle(1, 3359829, 0.4);
    ig.lineBetween(10, py, PANEL_W - 10, py);
    py += 10;
    s.add.text(PANEL_W / 2, py, "RPS BONUSES", {
      color: "#445566",
      fontFamily: "monospace",
      fontSize: "8pt",
      fontStyle: "bold"
    }).setOrigin(0.5, 0).setScrollFactor(sf).setDepth(11);
    py += 17;
    const rpsRows = [
      ["\u25CF", "rock", "beats", "\u2702 scissors"],
      ["\u2702", "scissors", "beats", "\u2261 paper"],
      ["\u2261", "paper", "beats", "\u25CF rock"]
    ];
    const rpsColMap = { "\u25CF": "#ff9966", "\u2702": "#ffdd44", "\u2261": "#88ccff" };
    for (const [sym, attacker, , victim] of rpsRows) {
      s.add.text(12, py, sym, { color: rpsColMap[sym], fontFamily: "monospace", fontSize: "9pt", fontStyle: "bold" }).setScrollFactor(sf).setDepth(11);
      s.add.text(24, py, `${attacker} > ${victim}`, { color: "#667788", fontFamily: "monospace", fontSize: "8pt" }).setScrollFactor(sf).setDepth(11);
      py += 15;
    }
    py += 4;
    s.add.text(12, py, "+25% dmg on advantage", { color: "#3a6645", fontFamily: "monospace", fontSize: "7.5pt" }).setScrollFactor(sf).setDepth(11);
    py += 15;
    s.add.text(12, py, " \xD71.0  otherwise", { color: "#3a4455", fontFamily: "monospace", fontSize: "7.5pt" }).setScrollFactor(sf).setDepth(11);
  }
  new Phaser.Game({
    type: Phaser.AUTO,
    width: W,
    height: H,
    backgroundColor: "#12141e",
    scale: { mode: Phaser.Scale.NONE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { preload, create, update },
    render: { antialias: true, antialiasGL: true, pixelArt: false }
  });
  function preload() {
  }
  function create() {
    _scene = this;
    const dg = _scene.add.graphics().setScrollFactor(0).setDepth(1);
    dg.lineStyle(1, 3359846, 0.35);
    for (let y = 0; y < H; y += 16) dg.lineBetween(ARENA_CX, y, ARENA_CX, y + 8);
    _scene.add.text(PANEL_W + 12, 8, "ENEMIES \u2192", { color: "#774433", fontFamily: "monospace", fontSize: "10pt" }).setScrollFactor(0).setDepth(10);
    _scene.add.text(W - 12, 8, "\u2190 ALLIES", { color: "#334477", fontFamily: "monospace", fontSize: "10pt" }).setOrigin(1, 0).setScrollFactor(0).setDepth(10);
    _hpGfx = _scene.add.graphics().setDepth(3);
    buildPanel();
  }
  function update(_t, deltaMs) {
    updateCombat(Math.min(deltaMs / 1e3, 0.05));
    applySeparation();
    updateLabels();
    drawHPBars();
    refreshCounters();
  }
})();
</script>

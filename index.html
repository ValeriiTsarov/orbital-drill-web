          for (const sys of G.world.systems) {
            const { col: sc, row: sr } = worldToCell(sys.x, sys.y);
            if (sc !== col || sr !== row) continue;
            const sp2 = project(sys.x, sys.y);
            if (sys.type === "Gate") {
              g.lineStyle(2, 10053375, 0.85);
              g.strokeCircle(sp2.x, sp2.y, 7);
              g.fillStyle(6697898, 0.35);

                sp2.y - 7,
                "\u2B21 portal",
                { color: "#aa77ff", fontFamily: "monospace", fontSize: "8pt" }
              ));
              continue;
            }
            let dotColor = ZONE_COLOR[sys.zone] || 8947848;
            if (sys.type === "Sun") dotColor = 16755268;
            g.fillStyle(dotColor, 0.4);
            g.fillCircle(sp2.x, sp2.y, 4);
            g.lineStyle(0.5, dotColor, 0.2);
            g.strokeCircle(sp2.x, sp2.y, 6);
            if (scannerOn) {
              const jpN = sys.jumpPoints?.length ?? 0;
              if (jpN > 0) {
                const colStr = "#" + dotColor.toString(16).padStart(6, "0");
                addLabel(ctx.scene.add.text(
                  sp2.x + 6,
                  sp2.y - 9,
                  `${jpN}\u2B21`,
                  { color: colStr, fontFamily: "monospace", fontSize: "8pt" }
                ).setAlpha(0.7));
              }
            }
          }
          HUD.map.clickZones.push({
            sx: scx,
            sy: scy,
            sz: cellPx / 2 - 2,
            cb: () => {
              if (G.world.mapGridActive !== key) {
                const prevCell = G.world.mapGridActive ? G.world.mapGrid?.get(G.world.mapGridActive) : void 0;
                G.world.mapGridActive = key;
                resetCellTimer(prevCell);
                const hasSavedProgress = cell.timer < cell.timerMax;
                const initialElapsed = hasSavedProgress ? cell.timerMax - cell.timer : 0;
                if (!hasSavedProgress) cell.timer = cell.timerMax;
                const _cartLvl = G.skills["cartograph"] ?? 0;
                cellTimer = makeClickTimer({
                  duration: cell.timerMax,
                  clickStep: 1 + _cartLvl,
                  initialElapsed,
                  onFirstClick: hasSavedProgress ? void 0 : () => {
                    if (G.eco.coins < cell.timerMax) return false;
                    G.eco.coins = Math.max(0, G.eco.coins - cell.timerMax);
                    return true;
                  },
                  onFire: () => {
                    openCell(key);
                    grantBooster("mapCell", { cost: cell.timerMax, zone: G.world.currentSystem?.zone });
                    G.world.mapGridActive = null;
                  }
                });
              }
              if (!cellTimer) return;
              cellTimer.click();
              if (cellTimer.isActive) startAutoClicker(cellAutoClicker, () => cellTimer.click());
            }
          });
          continue;
        }
        g.fillStyle(858670, 1);
        g.fillRect(tlx, tly, cellPx, cellPx);
        g.lineStyle(1, 2768725, 1);
        g.strokeRect(tlx, tly, cellPx, cellPx);
        for (const sys of G.world.systems) {
          const { col: sc, row: sr } = worldToCell(sys.x, sys.y);
          if (sc !== col || sr !== row) continue;
          const sp2 = project(sys.x, sys.y);
          let color = ZONE_COLOR[sys.zone] || 8947848, rad = 5;
          if (sys.type === "Sun") {
            color = 16755268;
            rad = 9;
          }
          if (sys.type === "Gate") {
            color = 10053375;
            rad = 6;
          }
          const isSelected = G.selected?.obj === sys;
          const isCurrent = sys === G.world.currentSystem;
          g.fillStyle(color, 1);
          g.fillCircle(sp2.x, sp2.y, rad + (isSelected ? 2 : 0));
          if (isSelected) {
            g.lineStyle(2, 16777215, 1);
            g.strokeCircle(sp2.x, sp2.y, rad + 5);
          }
          if (isCurrent) {
            g.lineStyle(1.5, 8962303, 0.9);
            g.strokeCircle(sp2.x, sp2.y, rad + 3);
          }
          g.lineStyle(1, 16777215, 0.25);
          g.strokeCircle(sp2.x, sp2.y, rad + 1);
          addLabel(ctx.scene.add.text(
            sp2.x + 9,
            sp2.y - 8,
            sys.id ?? "",
            { color: "#cfcfcf", fontFamily: "monospace", fontSize: "10pt" }
          ));
          if (sys.isOpen && (sys.jumpPoints?.length ?? 0) > 0 && !isCurrent) {
            const hitSz = Math.max(14, rad + 8);
            HUD.map.clickZones.push({
              sx: sp2.x,
              sy: sp2.y,
              sz: hitSz,
              cb: () => {
                const prevCell = G.world.mapGridActive ? G.world.mapGrid?.get(G.world.mapGridActive) : void 0;
                G.world.mapGridActive = null;
                resetCellTimer(prevCell);
                onJumpPointClick(sys, 0);
              }
            });
          }

      }

    const curObj = G.world.currentSystem;
    const mapShelterX = curObj ? curObj.x : G.world.shelter.x;
    const mapShelterY = curObj ? curObj.y : G.world.shelter.baseY;
    const sp = project(mapShelterX, mapShelterY);
    g.fillStyle(8962303, 1);
    g.fillTriangle(sp.x, sp.y - 7, sp.x - 5, sp.y + 5, sp.x + 5, sp.y + 5);
    g.lineStyle(1, 16777215, 1);
    g.strokeTriangle(sp.x, sp.y - 7, sp.x - 5, sp.y + 5, sp.x + 5, sp.y + 5);
    addLabel(ctx.scene.add.text(
      sp.x + 9,
      sp.y + 8,
      "you",
      { color: "#88c0ff", fontFamily: "monospace", fontSize: "11pt" }
    ));
    const jumpR = G.ship.batteryCap * UNIT * s;
    g.lineStyle(1.5, 8969727, 0.5);
    g.strokeCircle(sp.x, sp.y, jumpR);
    addLabel(ctx.scene.add.text(
      sp.x + jumpR + 4,
      sp.y,
      `\u26A1${G.ship.batteryCap.toFixed(1)}`,
      { color: "#88ddff", fontFamily: "monospace", fontSize: "9pt" }
    ).setAlpha(0.7));
    if (G.selected) {
      const { obj, jpIdx } = G.selected;
      const jp = obj.jumpPoints[jpIdx];
      const jdx = obj.x + jp.dx - mapShelterX, jdy = obj.y + jp.dy - mapShelterY;
      const cost = Math.hypot(jdx, jdy) / UNIT;
      const canAfford = cost <= G.ship.battery;
      const btnX = offX + viewW / 2, btnY = offY + viewH - 20;
      const btnLabel = canAfford ? `\u25B6 JUMP to ${obj.id}  (${cost.toFixed(2)}\u26A1)  [Space]` : `\u2715 not enough battery  need ${cost.toFixed(2)}\u26A1 \xB7 have ${G.ship.battery.toFixed(2)}`;
      const btnColor = canAfford ? 1122867 : 2099208;
      const btnStroke = canAfford ? 8962303 : 16733491;
      g.fillStyle(btnColor, 1);
      g.fillRoundedRect(btnX - 200, btnY - 14, 400, 28, 4);
      g.lineStyle(1.5, btnStroke, 1);
      g.strokeRoundedRect(btnX - 200, btnY - 14, 400, 28, 4);
      addLabel(ctx.scene.add.text(
        btnX,
        btnY,
        btnLabel,
        { color: canAfford ? "#88c0ff" : "#ff5533", fontFamily: "monospace", fontSize: "11pt" }
      ).setOrigin(0.5));
      if (canAfford) {
        HUD.map.clickZones.push({
          sx: btnX,
          sy: btnY,
          sz: 200,
          szY: 16,
          cb: () => {
            closeMap();
            startTravel();
          }
        });
      }
    }
  }

    HUD.hpBar.fillColor = G.ship.hp / G.ship.hpMax < 0.25 ? 16733542 : G.ship.hp / G.ship.hpMax < 0.55 ? 16755285 : 7855479;
    const repRate = getRepairRate();
    HUD.repairBadge.setText(repRate > 0 ? `+${repRate.toFixed(1)} hp/s` : "");
    const { count: buoyCount, coinsPerTick } = getBuoyStats();
    HUD.buoyText.setText(buoyCount > 0 ? `buoy: ${buoyCount}  \u25CF ${coinsPerTick}/min` : "");
    if (G.world.activeAsteroid) {
      const phase = getHeatPhase();
      const threat = getThreatScore().toFixed(1);
      const phaseLabel = phase === 1 ? "phase 1" : phase === 2 ? "phase 2 \u25CF" : "phase 3 \u25CF\u25CF";
      const phaseColor = phase === 1 ? "#446644" : phase === 2 ? "#cc7722" : "#dd3333";
      HUD.heatText.setText(`heat ${phaseLabel}  threat ${threat}`);
      HUD.heatText.setColor(phaseColor);
    } else {
      HUD.heatText.setText("");
    }
    const t = G.world.currentSystem?.escalateCounter ?? 0;
    const TW = 240;
    const col = t < 0.33 ? 3390259 : t < 0.67 ? 13417250 : 14496563;
    HUD.threatFill.width = t * TW;
    HUD.threatFill.fillColor = col;
    if (t < 5e-3) {
      HUD.threatLabel.setText("");
    } else {
      const step = t < 0.33 ? "\u25B2" : t < 0.67 ? "\u25B2\u25B2" : "\u25B2\u25B2\u25B2";
      const name = t < 0.33 ? "escalating" : t < 0.67 ? "alert" : "danger";
      const decay = G.travelMode !== "idle" ? " \u25BC" : "";
      HUD.threatLabel.setText(`${step} ${name}${decay}`);
      HUD.threatLabel.setColor("#" + col.toString(16).padStart(6, "0"));
    }
    HUD.travelBtn.setVisible(false);
    HUD.travelBtnTxt.setVisible(false);
    if (HUD.jumpBtn) {
      const obj = G.world.currentSystem;
      const ox = obj?.x ?? G.world.shelter.x, oy = obj?.y ?? G.world.shelter.baseY;
      let nearestCost = Infinity;
      if (obj) {
        for (const o of G.world.systems) {
          if (o === obj || !o.isOpen || !o.jumpPoints?.length) continue;
          for (const jp of o.jumpPoints) {
            const d = Math.hypot(o.x + jp.dx - ox, o.y + jp.dy - oy) / UNIT;
            if (d < nearestCost) nearestCost = d;
          }
        }
      }
      const canJump = nearestCost <= G.ship.battery;
      const col2 = nearestCost < Infinity && canJump ? 4513160 : nearestCost < Infinity ? 16733491 : 4491468;
      const colStr = "#" + col2.toString(16).padStart(6, "0");
      HUD.jumpBtn.costTxt.setText(
        nearestCost < Infinity ? canJump ? `\u2713 ${nearestCost.toFixed(1)}\u26A1` : `\u2717 ${nearestCost.toFixed(1)}\u26A1` : "[M]"
      );
      HUD.jumpBtn.costTxt.setColor(colStr);
      HUD.jumpBtn.icon.setColor(colStr);
      HUD.jumpBtn.bg.setStrokeStyle(1.5, col2);
    }
    for (let i = 0; i < HUD.slots.length; i++) {
      const slot = G.droneSlots[i];
      const ui = HUD.slots[i];
      const isLocked = slot.state === "locked";
      const isEmpty = slot.state === "empty";
      const hasDrone = slot.drone != null;
      ui.lockOverlay?.setVisible(isLocked);
      ui.lockIcon?.setVisible(isLocked);
      ui.lockPrice?.setVisible(isLocked);
      ui.plusBtn?.setVisible(isEmpty);
      ui.plusTxt?.setVisible(isEmpty);
      const canKill = (hasDrone || slot.state === "building") && !isLocked;
      ui.killBtn?.setVisible(canKill);
      if (isLocked) {

  // src/drones/states/orbiting.ts
  function tickOrbiting(d, dt) {
    if (DRONE_TIERS[d.droneType]?.role !== "interceptor") {
      d.state = "IDLE";
      return;
    }
    if (!targetAlive(d.target)) {
      d.target = null;
      d.state = "IDLE";
      return;
    }
    if (d.charge < 1) {
      d.target = null;
      d.chargeAngle = Math.atan2(d.y - G.world.shelter.y, d.x - G.world.shelter.x);
      d.state = "CHARGING";
      return;
    }
    if (Math.hypot(d.target.x - G.world.shelter.x, d.target.y - G.world.shelter.y) > C.droneRange) {
      d.target = null;
      d.state = "IDLE";
      return;
    }
    const tx = d.target.x, ty = d.target.y;
    d.orbitAngle += 2.5 * dt * d.orbitSpeed;
    d.x = tx + Math.cos(d.orbitAngle) * C.interceptorOrbitRadius;
    d.y = ty + Math.sin(d.orbitAngle) * C.interceptorOrbitRadius;
    d.rotation = Math.atan2(ty - d.y, tx - d.x);
    d.fireTimer += dt;
    if (d.fireTimer >= (DRONE_TIERS[d.droneType]?.fireInterval ?? 0.5) / getDefenceMultiplier()) {
      d.fireTimer = 0;
      d.charge = Math.max(0, d.charge - 1);
      fireLaser(d.x, d.y, tx, ty, DRONE_TYPES.interceptor.color);
      if (G.combat.enemies.includes(d.target)) damageEnemy(d.target, d.damage * getMul("drones"));
      else damageMeteor(d.target, d.damage * getMul("drones"));
    }
  }

  // src/drones/states/patrol.ts
  function tickPatrol(d, dt) {
    if (DRONE_TIERS[d.droneType]?.role !== "interceptor") {
      d.state = "IDLE";
      return;
    }
    if (d.charge < 1) {
      d.chargeAngle = Math.atan2(d.y - G.world.shelter.y, d.x - G.world.shelter.x);
      d.state = "CHARGING";
      return;
    }
    const patrolR = C.interceptorShipOrbitRadius;
    const ptx = G.world.shelter.x + Math.cos(d.sentryAngle) * patrolR;
    const pty = G.world.shelter.y + Math.sin(d.sentryAngle) * patrolR;
    const pdx = ptx - d.x, pdy = pty - d.y;
    const pdist = Math.hypot(pdx, pdy);
    if (pdist > 6) {
      d.x += pdx / pdist * C.interceptorSpeed * dt;
      d.y += pdy / pdist * C.interceptorSpeed * dt;
      d.rotation = Math.atan2(pdy, pdx);
      applyMeteorEvasion(d, dt);
    } else {
      d.sentryAngle += 0.7 * dt * d.orbitSpeed;
      for (const m of G.combat.meteors) {
        const rx = d.x - m.x, ry = d.y - m.y;
        const dist = Math.hypot(rx, ry);
        if (dist < EVADE_RADIUS && dist > 0.5 && m.vx * -rx + m.vy * -ry > 0) {
          d.sentryAngle += (1 - dist / EVADE_RADIUS) * 3 * dt;
        }
      }
      d.x = G.world.shelter.x + Math.cos(d.sentryAngle) * patrolR;
      d.y = G.world.shelter.y + Math.sin(d.sentryAngle) * patrolR;
      d.rotation = d.sentryAngle + Math.PI / 2;
    }
    const tgt = findInterceptorTarget();
    if (tgt) {
      d.target = tgt;
      d.chaseTimer = 0;
      d.state = "INTERCEPTING";
    }
  }

  // src/drones/states/sentry-guard.ts
  function tickSentryGuard(d, dt) {
    if (DRONE_TIERS[d.droneType]?.role !== "sentry") {
      d.state = "IDLE";
      return;

    d.sentryAngle += C.sentryOrbitSpeed * dt * d.orbitSpeed;
    d.x = G.world.shelter.x + Math.cos(d.sentryAngle) * C.sentryShipOrbitRadius;
    d.y = G.world.shelter.y + Math.sin(d.sentryAngle) * C.sentryShipOrbitRadius;
    d.rotation += 0.8 * dt;
    d.fireTimer += dt;
    const sentryInterval = DRONE_TIERS[d.droneType]?.fireInterval ?? 1;
    if (d.fireTimer >= sentryInterval / getDefenceMultiplier()) {
      d.fireTimer = 0;
      if (d.charge >= 1) {
        let best = null, bestD = Infinity;
        for (const e of G.combat.enemies) {
          if (e.dead) continue;
          const dist = Math.hypot(e.x - G.world.shelter.x, e.y - G.world.shelter.baseY);
          if (dist <= C.droneRange && dist < bestD) {
            bestD = dist;
            best = e;
          }
        }
        for (const m of G.combat.meteors) {
          const dist = Math.hypot(m.x - G.world.shelter.x, m.y - G.world.shelter.baseY);
          if (dist <= C.droneRange && dist < bestD) {
            bestD = dist;
            best = m;
          }
        }
        if (best) {
          d.charge = Math.max(0, d.charge - 1);
          const sentryColor = (DRONE_TYPES[d.droneType] ?? DRONE_TYPES.sentry).color;
          const sentryDmg = DRONE_TIERS[d.droneType]?.dmg ?? C.sentryDamage;
          fireLaser(d.x, d.y, best.x, best.y, sentryColor);
          if (G.combat.enemies.includes(best)) damageEnemy(best, sentryDmg * getMul("drones"));
          else damageMeteor(best, sentryDmg * getMul("drones"));
        }
      }
    }
  }

  // src/drones/states/to-shelter.ts

  // src/drones/index.ts

    const orig = d.fillColor;

  function spawnDrone(droneType) {

  function updateDrones(dt) {

      if (d._remove) continue;
      d.chargeMax = getChargeMax(d.droneType);
      if (d.dying && !d._remove) {
        if (d.squadSlot) {
          const slotRef = d.squadSlot;
          const alive = G.drones.filter((d2) => d2.squadSlot === slotRef && d2 !== d && !d2._remove && !d2.dying);
          if (alive.length === 0) {
            slotRef.pendingType = d.droneType;
            slotRef.state = "building";
            slotRef.progress = 0;
            slotRef.drone = null;
          } else {
            slotRef.drone = alive[0];
            slotRef.squadRebuildPending = (slotRef.squadRebuildPending || 0) + 1;
            slotRef.squadRebuildTimer = slotRef.squadRebuildTimer ?? 0;
          }
        } else {
          for (const slot of G.droneSlots) {
            if (slot.drone === d) {
              slot.pendingType = d.droneType;
              slot.state = "building";
              slot.progress = 0;
              slot.drone = null;
              break;
            }
          }
        }
        d.oreDot?.destroy();
        d.oreDot = null;
        d.batteryIcon?.destroy();
        d.batteryIcon = null;
        d._remove = true;
        continue;
      }
      switch (d.state) {
        case "IDLE":
          tickIdle(d, dt);
          break;
        case "REPAIRING":
          tickRepairing(d, dt);
          break;
        case "CHARGING":
          tickCharging(d, dt);
          break;
        case "INTERCEPTING":
          tickIntercepting(d, dt);
          break;
        case "ORBITING":
          tickOrbiting(d, dt);
          break;
        case "PATROL":
          tickPatrol(d, dt);
          break;
        case "SENTRY_GUARD":
          tickSentryGuard(d, dt);
          break;
        case "TO_ASTEROID":
          tickToAsteroid(d, dt);
          break;
        case "MINING":
          tickMining(d, dt);
          break;
        case "TO_SHELTER":
          tickToShelter(d, dt);
          break;
        case "UNLOADING":
          tickUnloading(d, dt);
          break;
      }
      if (d._remove) continue;
      const _cdx = d.x - G.world.shelter.x, _cdy = d.y - G.world.shelter.y;
      const _cdist = Math.hypot(_cdx, _cdy);
      if (_cdist > C.droneRange && _cdist > 0.1) {
        d.x = G.world.shelter.x + _cdx / _cdist * C.droneRange;
        d.y = G.world.shelter.y + _cdy / _cdist * C.droneRange;
      }
      const nearShipState = d.state === "IDLE" || d.state === "CHARGING" || d.state === "PATROL" || d.state === "SENTRY_GUARD" || d.state === "REPAIRING" || d.state === "UNLOADING";
      if (nearShipState && d.charge < d.chargeMax && G.ship.battery > 0) {
        const regenR = C.shelterVisibilityRadius;
        if (Math.hypot(d.x - G.world.shelter.x, d.y - G.world.shelter.y) <= regenR) {
          const rate = 0.5 / getChargeInterval(d) * C.chargeRateMult * getDronesMultiplier();
          const gain = Math.min(d.chargeMax - d.charge, rate * dt);
          d.charge += gain;
          G.ship.battery = Math.max(0, G.ship.battery - gain * 0.1);
        }
      }
      if (d.hp < d.hpMax) {
        const regenR = C.shelterVisibilityRadius;
        if (Math.hypot(d.x - G.world.shelter.x, d.y - G.world.shelter.y) <= regenR) {
          const heal = Math.min(d.hpMax - d.hp, C.droneDockRepairRate * getRegenMultiplier() * dt);
          G.ship.battery = Math.max(0, G.ship.battery - heal * 5e-3);
          d.hp += heal;
        }
      }
      if (d.batteryIcon) {
        const showIcon = d.visible && d.charge / d.chargeMax < 0.25;
        d.batteryIcon.setVisible(showIcon);
        if (showIcon) {
          d.batteryIcon.x = d.x;
          d.batteryIcon.y = d.y - 14;
        }
      }
      if (d.oreDot) {
        const showOre = d.cargoTier !== null && d.visible && (d.state === "TO_SHELTER" || d.state === "UNLOADING");
        d.oreDot.setVisible(showOre);
        if (showOre) {
          d.oreDot.x = d.x + 5;
          d.oreDot.y = d.y - 5;
          d.oreDot.setFillStyle(TIER[d.cargoTier].color);
        }
      }
    }
  }
  function updateAsteroidSizes() {

      if (Math.abs(o.r - newR) > 0.3) {

      if (o.coreGfx) {

    for (let i = G.drones.length - 1; i >= 0; i--)

      const s = G.world.systems.find((x) => x.id === sv.id);
      if (!s) continue;
      s.knownState = sv.knownState ?? s.knownState;
      s.clickProgress = sv.clickProgress ?? 0;
      s.isOpen = sv.isOpen ?? false;
      s.revealed = sv.revealed ?? false;
      s.looted = sv.looted ?? false;
      s.escalateCounter = sv.escalateCounter ?? 0;
      s.localState = sv.localState ?? null;
      for (const jp of s.jumpPoints ?? []) jp.isOpen = s.isOpen ?? false;
    }
  }
  function serializeDroneSlots() {
    return G.droneSlots.map((s) => ({
      state: s.state === "active" ? "active" : s.state,
      progress: s.progress,
      droneHp: s.drone ? s.drone.hp : null,
      droneType: s.drone ? s.drone.droneType : s.pendingType || null
    }));
  }
  function applyDroneSlots(saved) {
    if (!saved) {
      G.droneSlots[0].drone = spawnDrone("miner");
      G.droneSlots[0].state = "active";
      const slot1 = G.droneSlots[1];
      const squadSize = DRONE_TIERS.interceptor.squadSize;
      for (let j = 0; j < squadSize; j++) {
        const d = spawnDrone("interceptor");
        d.squadSlot = slot1;
        if (j === 0) slot1.drone = d;
      }
      slot1.state = "active";
      return;
    }
    for (let i = 0; i < G.droneSlots.length && i < saved.length; i++) {
      const sv = saved[i];
      const savedState = sv.state === "docked" ? "active" : sv.state;
      if (savedState === "active") {
        const droneType = sv.droneType || "miner";
        const squadSize = DRONE_TIERS[droneType]?.squadSize ?? 1;
        for (let j = 0; j < squadSize; j++) {
          const d = spawnDrone(droneType);
          d.squadSlot = G.droneSlots[i];
          if (j === 0) {
            G.droneSlots[i].drone = d;
            if (sv.droneHp != null) d.hp = sv.droneHp;
          }
        }
        G.droneSlots[i].state = "active";
      } else if (savedState === "building") {
        G.droneSlots[i].state = "building";
        G.droneSlots[i].progress = sv.progress;
        G.droneSlots[i].pendingType = sv.droneType || "miner";
      } else {
        G.droneSlots[i].state = savedState;
      }
    }
  }
  function serializeMapGrid() {
    if (!G.world.mapGrid) return [];
    return Array.from(G.world.mapGrid.entries()).map(([k, c]) => ({
      key: k,
      col: c.col,
      row: c.row,
      state: c.state,
      timer: c.timer,
      timerMax: c.timerMax
    }));
  }
  function applyMapGrid(saved) {
    if (!saved.length || !G.world.mapGrid) return;
    G.world.mapGrid.clear();
    for (const c of saved) {
      G.world.mapGrid.set(c.key, { col: c.col, row: c.row, state: c.state, timer: c.timer, timerMax: c.timerMax });
    }
  }

  // src/save.ts
  var _cleared = false;
  function loadSkills() {
    try {
      return JSON.parse(localStorage.getItem("od_skills") || "{}");
    } catch {
      return {};
    }
  }
  function saveSkills() {
    localStorage.setItem("od_skills", JSON.stringify(G.skills));
  }
  function saveGame() {
    if (_cleared) return;
    try {
      const data = {
        v: 2,
        currentSystemId: G.world.currentSystem?.id,
        upgrades: G.upgrades
      };
      for (const f of SCALAR_FIELDS) data[f.key] = f.get();
      data.systems = serializeSystems();
      data.droneSlots = serializeDroneSlots();
      data.mapGrid = serializeMapGrid();
      localStorage.setItem("od_save", JSON.stringify(data));
    } catch (e) {
      console.error("[save] failed:", e);
    }
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem("od_save");
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d.v === 2 ? d : null;
    } catch {
      return null;
    }
  }
  function clearSave() {
    _cleared = true;
    localStorage.removeItem("od_save");
    localStorage.removeItem("od_skills");
  }

  // src/shelter.ts
  function initShelter() {
    G.world.shelter.gfx = buildShelterShape(G.world.shelter.x, G.world.shelter.y);
    G.world.shelter.thrusterGfx = ctx.scene.add.graphics().setDepth(2);
    G.world.shelter.label = ctx.scene.add.text(G.world.shelter.x - 14, G.world.shelter.y + 24, "shelter", {
      color: "#88c0ff",
      fontFamily: "monospace",
      fontSize: "12pt"
    });
    G.world.shelter.clickInteract = makeClickable(G.world.shelter.gfx, {
      getX: () => G.world.shelter.x,
      getY: () => G.world.shelter.baseY,
      r: 18,
      duration: C.shelterClickDuration,
      ringColor: 4508927,
      onFire: () => {
        ctx.scene.tweens.add({ targets: G.world.shelter.gfx, scaleX: 1.18, scaleY: 1.18, duration: 70, yoyo: true });
        G.ship.battery = Math.min(G.ship.batteryCap, G.ship.battery + G.ship.batteryCap * C.shelterBatteryBonus);
      }
    });
    G.world.shelter.cameraTarget = ctx.scene.add.container(G.world.shelter.x, G.world.shelter.baseY);
    ctx.cam.centerOn(G.world.shelter.x, G.world.shelter.baseY);
    G.world.shelter.rangeGfx = ctx.scene.add.graphics().setDepth(3);
    G.world.shelter.routeCircleGfx = ctx.scene.add.graphics().setDepth(1);
  }
  function drawThruster(time) {
    const g = G.world.shelter.thrusterGfx;
    if (!g) return;
    g.clear();
    const sf = G.world.shelter.speedFactor ?? 0;
    if (sf <= 0 || !G.world.shelter.gfx?.visible) return;
    const facing = G.world.shelter.facing;
    const sx = G.world.shelter.x, sy = G.world.shelter.gfx.y;
    const cf = Math.cos(facing), sinf = Math.sin(facing);
    const toWorld = (lx, ly) => ({ x: sx + lx * cf - ly * sinf, y: sy + lx * sinf + ly * cf });
    const ports = [{ lx: -18, ly: -5.5 }, { lx: -18, ly: 5.5 }];
    for (const port of ports) {
      const pw = toWorld(port.lx, port.ly);
      const flicker = 0.8 + Math.sin(time * 0.02 + port.ly * 5) * 0.2;
      const len = 28 * sf * flicker;
      const wid = 5 * sf;
      const tip = { x: pw.x - cf * len, y: pw.y - sinf * len };
      const mid = { x: pw.x - cf * len * 0.5, y: pw.y - sinf * len * 0.5 };
      const perpX = -sinf, perpY = cf;
      g.fillStyle(16737792, 0.7);
      g.fillTriangle(
        pw.x + perpX * wid,
        pw.y + perpY * wid,
        pw.x - perpX * wid,
        pw.y - perpY * wid,
        tip.x,
        tip.y
      );
      g.fillStyle(16777147, 0.9);
      g.fillTriangle(
        pw.x + perpX * wid * 0.4,
        pw.y + perpY * wid * 0.4,
        pw.x - perpX * wid * 0.4,
        pw.y - perpY * wid * 0.4,
        mid.x,
        mid.y
      );
    }
  }
  function updateShelter(time, overlayOpen) {
    if (!overlayOpen) {
      G.world.shelter.gfx.y = G.world.shelter.baseY + Math.sin(time * C.shelterBobFreq) * C.shelterBobAmp;
      G.world.shelter.label.y = G.world.shelter.gfx.y + 24;
      G.world.shelter.y = G.world.shelter.gfx.y;
    }
    drawThruster(time);
    const showWorld = !overlayOpen;
    G.world.shelter.gfx.setVisible(showWorld);
    G.world.shelter.label.setVisible(showWorld);
  }
  function updateDroneRangeCircle() {
    const g = G.world.shelter.rangeGfx;
    if (!g) return;
    g.clear();
    if (G.mapOpen || G.skillsOpen || G.travelMode !== "idle") return;
    g.lineStyle(1, 4504575, 0.28);
    g.strokeCircle(G.world.shelter.x, G.world.shelter.baseY, C.droneRange);
  }
  function tickShelterInteract(dt) {
    G.world.shelter.clickInteract?.tick(dt);
  }

  // src/input.ts
  function setupInput() {
    const scene = ctx.scene;
    scene.input.on("pointermove", (ptr) => {
      ctx.lastPtr = ptr;
    });
    scene.input.on("pointerdown", () => {
      closeAllDroneTypePopups();
    });
    scene.input.on("pointerup", () => {
      stopActiveAutoClicker();
    });
    scene.input.keyboard.on("keydown-SPACE", () => {
      if (G.mapOpen && G.world.mapGridActive) {
        mapGridStep();
        return;
      }
      simulateLMB();
    });
    scene.input.keyboard.on("keyup-SPACE", () => {
      stopActiveAutoClicker();
    });
    scene.input.keyboard.on("keydown-M", () => toggleMap());
    scene.input.keyboard.on("keydown-T", () => toggleSkills());
    scene.input.keyboard.on("keydown-ESC", () => {
      if (HUD.resetPopup?.all[0]?.visible) {
        closeResetPopup();
        return;
      }
      if (G.mapOpen) closeMap();
      if (G.skillsOpen) closeSkills();
    });
  }
  function simulateLMB() {
    const ptr = ctx.lastPtr;
    if (!ptr) return;
    if (G.mapOpen) {
      const { x, y } = ptrXY(ptr);
      for (const z of HUD.map?.clickZones || []) {
        if (Math.abs(x - z.sx) <= z.sz && Math.abs(y - z.sy) <= (z.szY ?? z.sz)) {
          z.cb();
          return;
        }
      }
      return;
    }
    const wx = ptr.worldX, wy = ptr.worldY;
    if (G.world.shelter.clickInteract && Math.hypot(wx - G.world.shelter.x, wy - G.world.shelter.baseY) <= 20) {
      G.world.shelter.clickInteract.start();
      return;
    }
    for (const o of G.world.localObjects) {
      if (!o.clickInteract || !o.gfx?.visible) continue;
      if (Math.hypot(wx - o.x, wy - o.y) <= Math.max(20, o.r || 8)) {
        o.clickInteract.start();
        return;
      }
    }
  }

  // src/startup.ts
  function initScene() {
    G.skills = loadSkills();
    const _save = loadSave();
    if (_save) G.upgrades = _save.upgrades || {};
    applyAll();
    drawStarfield(600, 0.4);
    generateMap();
    if (_save?.systems) applySystems(_save.systems);
    for (const s of G.world.systems) renderSystem(s);
    for (const s of G.world.systems) setSystemByState(s);
    buildFog();
    const startSys = (_save?.currentSystemId ? G.world.systems.find((s) => s.id === _save.currentSystemId) : null) ?? G.world.systems[0];
    G.world.currentSystem = startSys;
    G.world.shelter.x = startSys.x;
    G.world.shelter.y = startSys.y;
    G.world.shelter.baseY = startSys.y;
    if (_save) {
      for (const f of SCALAR_FIELDS) f.set(_save[f.key]);
    }
    initLocalObjects(startSys);
    renderLocalObjects();
    applyFogReveal(startSys);
    resetEnemyTimers();
    initShelter();
    for (let i = 0; i < C.droneSlotsTotal; i++) {
      const locked = i >= C.startingSlots;
      G.droneSlots.push({ state: locked ? "locked" : "empty", progress: 0, drone: null });
    }
    applyDroneSlots(_save?.droneSlots ?? null);
    pickActiveAsteroid();
    initMapGrid();
    if (_save?.mapGrid?.length) applyMapGrid(_save.mapGrid);
    buildHUD();
    setupInput();
    window.addEventListener("beforeunload", () => {
      if (G.world.currentSystem) G.world.currentSystem.localState = serializeLocalState();
      saveGame();
    });
  }

  // src/hangar.ts
  function updateDroneBuild(dt) {
    for (let i = 0; i < G.droneSlots.length; i++) {
      const slot = G.droneSlots[i];
      if (slot.state === "active" && (slot.squadRebuildPending ?? 0) > 0) {
        slot.squadRebuildTimer = (slot.squadRebuildTimer || 0) + dt / C.droneBuildTime;
        if (slot.squadRebuildTimer >= 1) {
          slot.squadRebuildTimer = 0;
          slot.squadRebuildPending--;
          const dtype = slot.drone?.droneType || "miner";
          const d = spawnDrone(dtype);
          d.squadSlot = slot;
        }
      }
      if (slot.state !== "building") continue;
      slot.progress += dt / C.droneBuildTime;
      if (slot.progress >= 1) {
        slot.progress = 1;
        const dtype = slot.pendingType || "miner";
        const count = DRONE_TIERS[dtype]?.squadSize ?? 1;
        for (let j = 0; j < count; j++) {
          const d = spawnDrone(dtype);
          d.squadSlot = slot;
          if (j === 0) slot.drone = d;
        }
        slot.pendingType = null;
        slot.state = "active";
        slot.squadRebuildPending = 0;
        slot.squadRebuildTimer = 0;
      }
    }
  }

  // src/tutorial.ts
  var jpHintDone = false;
  var _marker = null;
  function _createJumpHint() {
    const scene = ctx.scene;
    const x = W - 54, y = H / 2 - 42;
    const ring = scene.add.circle(x, y, 11, 0, 0).setStrokeStyle(2, 16768341).setScrollFactor(0).setDepth(99);
    const label = scene.add.text(
      x,
      y,
      "!",
      { color: "#ffdd55", fontFamily: "monospace", fontSize: "14pt", fontStyle: "bold" }
    ).setOrigin(0.5).setScrollFactor(0).setDepth(99);
    const proxy = { s: 1 };
    const tween = scene.tweens.add({
      targets: proxy,
      s: 1.5,
      duration: 550,
      yoyo: true,
      repeat: -1,
      ease: "Sine.easeInOut",
      onUpdate: () => {
        ring.setScale(proxy.s);
        label.setScale(proxy.s);
      }
    });
    return {
      destroy() {
        tween.stop();
        scene.tweens.add({
          targets: [ring, label],
          alpha: 0,
          duration: 200,
          ease: "Cubic.easeIn",
          onComplete: () => {
            ring.destroy();
            label.destroy();
          }
        });
      }
    };
  }
  function checkTutorial() {
    if (!jpHintDone && G.eco.coins >= 3) {
      jpHintDone = true;
      G.showMapHint = true;
    }
    if (G.showMapHint && !G.mapHintSeen && !_marker)
      _marker = _createJumpHint();
    if (G.mapHintSeen && _marker) {
      _marker.destroy();
      _marker = null;
    }
  }

  // src/death.ts
  function handleShelterDeath() {
    const insuranceLvl = G.skills["insurance"] || 0;
    G.eco.coins = Math.floor(G.eco.coins * insuranceLvl * 0.1);
    G.eco.cargo = { T1: 0, T2: 0, T3: 0 };
    G.eco.cargoTotal = 0;
    G.eco.refineTimer = 0;
    G.upgrades = {};
    applyAll();
    if (G.world.currentSystem?.zone === "Cyan")
      ctx.scene.time.delayedCall(0, () => {
        clearEnemies();
        resetEnemyTimers();
      });
    for (const d of G.drones) {
      d.oreDot?.destroy();
      d.batteryIcon?.destroy();
      d.destroy();
    }
    G.drones.length = 0;
    clearMeteors();
    for (let i = 0; i < G.droneSlots.length; i++) {
      G.droneSlots[i].state = i < C.startingSlots ? "empty" : "locked";
      G.droneSlots[i].progress = 0;
      G.droneSlots[i].drone = null;
      G.droneSlots[i].pendingType = null;
    }
    const slot0 = G.droneSlots[0];
    for (let j = 0; j < DRONE_TIERS.miner.squadSize; j++) {
      const d = spawnDrone("miner");
      d.squadSlot = slot0;
      if (j === 0) slot0.drone = d;
    }
    slot0.state = "active";
    const slot1 = G.droneSlots[1];
    for (let j = 0; j < DRONE_TIERS.interceptor.squadSize; j++) {
      const d = spawnDrone("interceptor");
      d.squadSlot = slot1;
      if (j === 0) slot1.drone = d;
    }
    slot1.state = "active";
    G.ship.battery = G.ship.batteryCap;
    G.ship.hp = G.ship.hpMax;
    if (G.world.currentSystem) G.world.currentSystem.localState = null;
    destroyLocalObjects();
    const home = G.world.systems[0];
    const hjp = home.jumpPoints[0];
    G.world.shelter.x = home.x + hjp.dx;
    G.world.shelter.y = home.y + hjp.dy;
    G.world.shelter.baseY = G.world.shelter.y;
    G.world.shelter.gfx.x = G.world.shelter.x;
    G.world.shelter.gfx.y = G.world.shelter.y;
    G.world.shelter.label.x = G.world.shelter.x - 14;
    G.world.shelter.label.y = G.world.shelter.y + 24;
    G.world.currentSystem = home;
    initLocalObjects(home);
    renderLocalObjects();
    if (G.world.shelter.cameraTarget) {
      G.world.shelter.cameraTarget.x = G.world.shelter.x;
      G.world.shelter.cameraTarget.y = G.world.shelter.baseY;
    }
    ctx.cam.centerOn(G.world.shelter.x, G.world.shelter.y);
    pickActiveAsteroid();
    saveGame();
    G.combat.deathFlash = 1;
    fadeTo(0.7, 0.15);
    ctx.scene.time.delayedCall(160, () => fadeTo(0, 0.5));
  }
  on("ship:death", handleShelterDeath);

  // src/game.ts
  var _textFactory = Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text = function(x, y, txt, style) {
    return _textFactory.call(this, x, y, txt, Object.assign({ resolution: DPR }, style || {}));
  };
  new Phaser.Game({
    type: Phaser.AUTO,
    width: W * DPR,
    height: H * DPR,
    backgroundColor: "#1a2845",
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: { create, update },
    render: { antialias: true, antialiasGL: true, pixelArt: false, roundPixels: false }
  });
  function create() {
    ctx.scene = this;
    ctx.cam = this.cameras.main;
    setupHiDPICamera(ctx.cam);
    initScene();
  }
  function update(time, deltaMs) {
    const dt = deltaMs / 1e3 * G.timeScale;
    const overlayOpen = G.mapOpen || G.skillsOpen;
    updateShelter(time, overlayOpen);
    if (G.combat.deathFlash > 0)
      G.combat.deathFlash = Math.max(0, G.combat.deathFlash - dt * 2);
    updateBoosters(dt);
    updateRewardBooster(dt);
    updateBoostersTimers(dt);
    if (G.travelMode === "idle") {
      updateGridMap(dt);
      updateDrones(dt);
      updateRefinery(dt);
      updateDroneBuild(dt);
      updateBuoyIncome(dt);
      updateJunk(dt);
      updateMeteors(dt);
      updateEnemies(dt);
      updateTentacles(dt);
      updateRepair(dt);
      updateBattery(dt);
      updateBoost(dt);
      updateBeacons(dt);
      updateDebris(dt);
      tickAsteroidTimers(dt);
    } else {
      updateTravel(dt);
    }
    updateSystemThreat(dt);
    updateBackground(dt);
    updateDroneRangeCircle();
    G.autoSaveTimer += dt;
    if (G.autoSaveTimer >= 5) {
      G.autoSaveTimer = 0;
      if (G.world.currentSystem) G.world.currentSystem.localState = serializeLocalState();
      saveGame();
    }
    updateAsteroidSizes();
    updateLocalVisibility();
    updateFog();
    updateJumpPointVisuals();
    tickLocalInteracts(dt);
    tickShelterInteract(dt);
    checkTutorial();
    updateHUD();
    drawMap();
  }
})();
</script>

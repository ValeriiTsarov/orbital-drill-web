 Ads). Les publicit\xE9s sont diffus\xE9es UNIQUEMENT via le SDK CrazyGames Ads. Pour diffuser et mesurer les publicit\xE9s, CrazyGames et ses partenaires publicitaires peuvent traiter des donn\xE9es techniques telles que le type d\u2019appareil, le navigateur, l\u2019adresse IP (pour la localisation approximative) et les interactions publicitaires. Cela est g\xE9r\xE9 par CrazyGames selon sa propre Politique de confidentialit\xE9 (crazygames.com/privacy). Nous n\u2019utilisons aucun autre r\xE9seau publicitaire.\n\u2022 Analytique. Nous utilisons GameAnalytics pour collecter des donn\xE9es de jeu ANONYMES \u2014 \xE9v\xE9nements de jeu, dur\xE9e de session, progression, type d\u2019appareil et pays \u2014 afin de comprendre comment le jeu est jou\xE9 et de l\u2019am\xE9liorer. Ces donn\xE9es ne servent pas \xE0 t\u2019identifier personnellement. Voir gameanalytics.com/privacy.\n\u2022 Progression sauvegard\xE9e. Ta progression et tes param\xE8tres sont stock\xE9s localement dans ton navigateur et, sur CrazyGames, peuvent \xEAtre synchronis\xE9s via la sauvegarde cloud de CrazyGames pour que tu puisses continuer sur plusieurs appareils.\n\n2. CE QUE NOUS NE FAISONS PAS\n\u2022 Nous ne demandons jamais ton nom, ton e-mail ou un compte personnel dans le jeu.\n\u2022 Nous ne vendons pas tes donn\xE9es personnelles.\n\u2022 Nous n\u2019utilisons aucun r\xE9seau publicitaire tiers autre que CrazyGames.\n\n3. ENFANTS\nLe jeu convient \xE0 un public g\xE9n\xE9ral (PEGI 12). Il ne collecte pas sciemment d\u2019informations personnelles aupr\xE8s des enfants. La publicit\xE9 et l\u2019analytique suivent les politiques de la plateforme CrazyGames.\n\n4. TES CHOIX\nTu peux effacer les donn\xE9es stock\xE9es localement \xE0 tout moment en vidant le stockage de ton navigateur ou en utilisant \xAB Nouvelle partie \xBB dans les Param\xE8tres. Pour les donn\xE9es trait\xE9es sur la plateforme CrazyGames, consulte la Politique de confidentialit\xE9 de CrazyGames.\n\n5. CONDITIONS D\u2019UTILISATION\nCe jeu est fourni \xAB tel quel \xBB, \xE0 des fins de divertissement, sans garantie d\u2019aucune sorte. Nous ne sommes pas responsables des pertes d\xE9coulant de son utilisation. Tous les \xE9l\xE9ments sont utilis\xE9s sous leurs licences respectives. Ces conditions peuvent changer ; continuer \xE0 jouer signifie que tu acceptes la version en vigueur.\n\n6. CONTACT\nQuestions sur cette politique : Aiwa Int \u2014 aiwainit2023@gmail.com"},it:{"settings.title":"IMPOSTAZIONI","settings.graphics":"Grafica","settings.quality":"Qualit\xE0","settings.quality.low":"bassa","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Lingua","settings.music":"Musica","settings.sound":"Suono","settings.ambient":"Ambiente","settings.skipTutorial":"Salta il tutorial","settings.logPanel":"Log di debug","settings.on":"s\xEC","settings.off":"no","settings.tip":"La qualit\xE0 influisce su animazioni ed effetti dell\u2019acqua (aiuta gli FPS su dispositivi deboli).","settings.privacy":"Questo gioco raccoglie analisi di gioco anonime (GameAnalytics) per migliorare il gioco.","settings.legal.link":"Privacy e termini","settings.legal.title":"PRIVACY E TERMINI","settings.legal.body":"Sviluppatore: Aiwa Int\nContatto: aiwainit2023@gmail.com\n\nQuesto gioco \xE8 distribuito sulla piattaforma CrazyGames. Giocandoci, accetti i punti seguenti.\n\n1. DATI RACCOLTI\n\u2022 Pubblicit\xE0 (CrazyGames Ads). Gli annunci vengono mostrati ESCLUSIVAMENTE tramite l\u2019SDK di CrazyGames Ads. Per mostrare e misurare gli annunci, CrazyGames e i suoi partner pubblicitari possono trattare dati tecnici come il tipo di dispositivo, il browser, l\u2019indirizzo IP (per la posizione approssimativa) e le interazioni con gli annunci. Ci\xF2 \xE8 gestito da CrazyGames secondo la propria Informativa sulla privacy (crazygames.com/privacy). Non utilizziamo alcun altro network pubblicitario.\n\u2022 Analisi. Utilizziamo GameAnalytics per raccogliere dati di gioco ANONIM

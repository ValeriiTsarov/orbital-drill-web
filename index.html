043D\u0448\u0438\u0445 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u0438\u0445 \u043C\u0435\u0440\u0435\u0436 \u043C\u0438 \u043D\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E.\n\u2022 \u0410\u043D\u0430\u043B\u0456\u0442\u0438\u043A\u0430. \u041C\u0438 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E GameAnalytics \u0434\u043B\u044F \u0437\u0431\u043E\u0440\u0443 \u0410\u041D\u041E\u041D\u0406\u041C\u041D\u0418\u0425 \u0456\u0433\u0440\u043E\u0432\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u2014 \u0456\u0433\u0440\u043E\u0432\u0456 \u043F\u043E\u0434\u0456\u0457, \u0442\u0440\u0438\u0432\u0430\u043B\u0456\u0441\u0442\u044C \u0441\u0435\u0441\u0456\u0457, \u043F\u0440\u043E\u0433\u0440\u0435\u0441, \u0442\u0438\u043F \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044E \u0442\u0430 \u043A\u0440\u0430\u0457\u043D\u0430 \u2014 \u0449\u043E\u0431 \u0440\u043E\u0437\u0443\u043C\u0456\u0442\u0438, \u044F\u043A \u0433\u0440\u0430\u044E\u0442\u044C, \u0456 \u043F\u043E\u043A\u0440\u0430\u0449\u0443\u0432\u0430\u0442\u0438 \u0433\u0440\u0443. \u0426\u0456 \u0434\u0430\u043D\u0456 \u043D\u0435 \u0456\u0434\u0435\u043D\u0442\u0438\u0444\u0456\u043A\u0443\u044E\u0442\u044C \u0432\u0430\u0441 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u043E. \u0414\u0438\u0432. gameanalytics.com/privacy.\n\u2022 \u0417\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0443. \u0412\u0430\u0448 \u043F\u0440\u043E\u0433\u0440\u0435\u0441 \u0456 \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044E\u0442\u044C\u0441\u044F \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u043E \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0456, \u0430 \u043D\u0430 CrazyGames \u043C\u043E\u0436\u0443\u0442\u044C \u0441\u0438\u043D\u0445\u0440\u043E\u043D\u0456\u0437\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u0447\u0435\u0440\u0435\u0437 \u0445\u043C\u0430\u0440\u043D\u0435 \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F CrazyGames, \u0449\u043E\u0431 \u0432\u0438 \u043C\u043E\u0433\u043B\u0438 \u043F\u0440\u043E\u0434\u043E\u0432\u0436\u0438\u0442\u0438 \u043D\u0430 \u0456\u043D\u0448\u0438\u0445 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044F\u0445.\n\n2. \u0427\u041E\u0413\u041E \u041C\u0418 \u041D\u0415 \u0420\u041E\u0411\u0418\u041C\u041E\n\u2022 \u041D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0437\u0430\u043F\u0438\u0442\u0443\u0454\u043C\u043E \u0432\u0430\u0448\u0435 \u0456\u043C\u02BC\u044F, email \u0447\u0438 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0438\u0439 \u0430\u043A\u0430\u0443\u043D\u0442 \u0443 \u0433\u0440\u0456.\n\u2022 \u041D\u0435 \u043F\u0440\u043E\u0434\u0430\u0454\u043C\u043E \u0432\u0430\u0448\u0456 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0456 \u0434\u0430\u043D\u0456.\n\u2022 \u041D\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E \u0436\u043E\u0434\u043D\u0438\u0445 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0456\u0445 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u0438\u0445 \u043C\u0435\u0440\u0435\u0436, \u043E\u043A\u0440\u0456\u043C CrazyGames.\n\n3. \u0414\u0406\u0422\u0418\n\u0413\u0440\u0430 \u043F\u0456\u0434\u0445\u043E\u0434\u0438\u0442\u044C \u0434\u043B\u044F \u0448\u0438\u0440\u043E\u043A\u043E\u0457 \u0430\u0443\u0434\u0438\u0442\u043E\u0440\u0456\u0457 (PEGI 12). \u0412\u043E\u043D\u0430 \u0441\u0432\u0456\u0434\u043E\u043C\u043E \u043D\u0435 \u0437\u0431\u0438\u0440\u0430\u0454 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0456 \u0434\u0430\u043D\u0456 \u0434\u0456\u0442\u0435\u0439. \u0420\u0435\u043A\u043B\u0430\u043C\u0430 \u0442\u0430 \u0430\u043D\u0430\u043B\u0456\u0442\u0438\u043A\u0430 \u043F\u0456\u0434\u043F\u043E\u0440\u044F\u0434\u043A\u043E\u0432\u0430\u043D\u0456 \u043F\u043E\u043B\u0456\u0442\u0438\u043A\u0430\u043C \u043F\u043B\u043 #define SHADER_NAME WATER_MAP_FS
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uMainSampler;
uniform float uTime;
uniform float uDistortion;
uniform float uScale;
uniform float uSpeed;
varying vec2 outTexCoord;
varying float outTintEffect;
varying vec4 outTint;

void main ()
{
  vec2 uv = outTexCoord;
  float t = uTime * uSpeed;
  // Two smooth pseudo-noise fields scrolling in opposite time directions; averaging them
  // hides the direction of travel so it reads as aimless sloshing rather than a current.
  vec2 a = vec2(
    sin(uv.y * uScale + t)       + 0.5 * sin(uv.x * uScale * 1.7 + t * 1.3),
    cos(uv.x * uScale + t * 1.1) + 0.5 * cos(uv.y * uScale * 1.7 - t * 0.9)
  );
  vec2 b = vec2(
    sin(uv.y * uScale * 1.3 - t * 1.2),
    cos(uv.x * uScale * 1.3 - t * 1.0)
  );
  vec2 disp = (a + b) * 0.25;
  vec4 texture = texture2D(uMainSampler, uv + disp * uDistortion);
  vec4 texel = vec4(outTint.bgr * outTint.a, outTint.a);
  vec4 color = texture * texel;
  if (outTintEffect == 1.0)
  {
    color.rgb = mix(texture.rgb, outTint.bgr * outTint.a, texture.a);
  }
  else if (outTintEffect == 2.0)
  {
    color = texel;
  }

435\u0437 \u0445\u043C\u0430\u0440\u043D\u0435 \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F CrazyGames, \u0449\u043E\u0431 \u0432\u0438 \u043C\u043E\u0433\u043B\u0438 \u043F\u0440\u043E\u0434\u043E\u0432\u0436\u0438\u0442\u0438 \u043D\u0430 \u0456\u043D\u0448\u0438\u0445 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044F\u0445.\n\n2. \u0427\u041E\u0413\u041E \u041C\u0418 \u041D\u0415 \u0420\u041E\u0411\u0418\u041C\u041E\n\u2022 \u041D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0437\u0430\u043F\u0438\u0442\u0443\u0454\u043C\u043E \u0432\u0430\u0448\u0435 \u0456\u043C\u02BC\u044F, email \u0447\u0438 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0438\u0439 \u0430\u043A\u0430\u0443\u043D\u0442 \u0443 \u0433\u0440\u0456.\n\u2022 \u041D\u0435 \u043F\u0440\u043E\u0434\u0430\u0454\u043C\u043E \u0432\u0430\u0448\u0456 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0456 \u0434\u0430\u043D\u0456.\n\u2022 \u041D\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E \u0436\u043E\u0434\u043D\u0438\u0445 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0456\u0445 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u0438\u0445 \u043C\u0435\u0440\u0435\u0436, \u043E\u043A\u0440\u0456\u043C CrazyGames.\n\n3. \u0414\u0406\u0422\u0418\n\u0413\u0440\u0430 \u043F\u0456\u0434\u0445\u043E\u0434\u0438\u0442\u044C \u0434\u043B\u044F \u0448\u0438\u0440\u043E\u043A\u043E\u0457 \u0430\u0443\u0434\u0438\u0442\u043E\u0440\u0456\u0457 (PEGI 12). \u0412\u043E\u043D\u0430 \u0441\u0432\u0456\u0434\u043E\u043C\u043E \u043D\u0435 \u0437\u0431\u0438\u0440\u0430\u0454 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0456 \u0434\u0430\u043D\u0456 \u0434\u0456\u0442\u0435\u0439. \u0420\u0435\u043A\u043B\u0430\u043C\u0430 \u0442\u0430 \u0430\u043D\u0430\u043B\u0456\u0442\u0438\u043A\u0430 \u043F\u0456\u0434\u043F\u043E\u0440\u044F\u0434\u043A\u043E\u0432\u0430\u043D\u0456 \u043F\u043E\u043B\u0456\u0442\u0438\u043A\u0430\u043C \u043F\u043B\u043

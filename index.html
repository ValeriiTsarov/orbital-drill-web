  // src/hidpi-camera.ts
  function setupHiDPICamera(cam) {
    cam.setZoom(DPR);
    cam.setOrigin(0, 0);
    cam.centerOnX = function(x) {
      this.midPoint.x = x;
      this.scrollX = x - this.width / this.zoomX / 2;
      if (this.useBounds) this.scrollX = this.clampX(this.scrollX);
      return this;
    };
    cam.centerOnY = function(y) {
      this.midPoint.y = y;
      this.scrollY = y - this.height / this.zoomY / 2;
      if (this.useBounds) this.scrollY = this.clampY(this.scrollY);
      return this;
    };
    cam.getScroll = function(x, y, out) {
      if (!out) out = new Phaser.Math.Vector2();
      out.x = x - this.width / this.zoomX / 2;
      out.y = y - this.height / this.zoomY / 2;
      if (this.useBounds) {
        out.x = this.clampX(out.x);
        out.y = this.clampY(out.y);
      }
      return out;
    };
    const _startFollow = cam.startFollow.bind(cam);
    cam.startFollow = function(target, roundPixels, lerpX, lerpY, offsetX, offsetY) {
      const halfW = this.width / this.zoomX / 2;
      const halfH = this.height / this.zoomY / 2;
      _startFollow(target, roundPixels, lerpX, lerpY, (offsetX || 0) + halfW, (offsetY || 0) + halfH);
      this.scrollX = target.x - (offsetX || 0) - halfW;
      this.scrollY = target.y - (offsetY || 0) - halfH;
      if (this.useBounds) {
        this.scrollX = this.clampX(this.scrollX);
        this.scrollY = this.clampY(this.scrollY);
      }
      return this;
    };
  }

  function buildSkillIconAtlas(scene) {
    if (_atlasBuilt) return;
    if (scene.textures.exists(SKL_ICON_ATLAS)) {
      _atlasBuilt = true;
      return;
    }
    const keys = SKILL_ICON_PRELOAD.map((p) => p.key).filter((k) => scene.textures.exists(k));
    if (keys.length === 0) return;
    let cell = 1;
    for (const k of keys) {
      const img = scene.textures.get(k).getSourceImage();
      cell = Math.max(cell, img.width, img.height);
    }
    const cols = Math.ceil(Math.sqrt(keys.length));
    const rows = Math.ceil(keys.length / cols);
    const cv = scene.textures.createCanvas(SKL_ICON_ATLAS, cols * cell, rows * cell);
    if (!cv) return;
    const cx = cv.getContext();
    cx.imageSmoothingEnabled = false;
    keys.forEach((k, i) => {
      const col = i % cols, row = i / cols | 0;
      const src = scene.textures.get(k).getSourceImage();
      const dx = col * cell, dy = row * cell;
      cx.drawImage(src, dx, dy);
      cv.add(k, 0, dx, dy, src.width, src.height);
    });
    cv.refresh();
    _atlasBuilt = true;
  }

  function runRaid(roster, garrison, skills2, formationMult = 1) {
    const snap = snapshotCombat();
    const prevSystem = G.world.currentSystem;
    const prevFortHp = G.fort.hp;
    const prevSkills = G.skills;
    const prevFormationMult = C.formationMult;
    if (skills2) {
      G.skills = { ...skills2 };
      applyAll();
    }
    C.formationMult = formationMult;
    G.world.currentSystem = null;
    G.combat.enemies.length = 0;
    G.combat.meteors.length = 0;
    G.units.length = 0;
    G.garrison.length = 0;
    let startEnemyCount = 0;
    for (const { type, count } of roster) {
      for (let i = 0; i < count; i++) {
        spawnRaidEnemy(type);
        startEnemyCount++;
      }
    }
    let startAllyCount = 0;
    for (const { type, count } of garrison) {
      for (let i = 0; i < count; i++) {
        const u = spawnUnit(type);
        u.x = G.world.fort.x + (Math.random() - 0.5) * 120;
        u.y = G.world.fort.baseY + (Math.random() - 0.5) * 120;
        u._isRaidUnit = true;
        startAllyCount++;
      }
    }
    let ticks = 0;
    let won = false;
    for (; ticks < MAX_TICKS; ticks++) {
      updateEnemies(SIM_DT);
      updateUnits(SIM_DT);
      updateVeinSizes();
      applyCombatSeparation();
      if (isRaidEnemiesCleared(startEnemyCount)) {
        won = true;
        break;
      }
      if (isRaidAlliesWiped(startAllyCount)) {
        won = false;
        break;
      }
    }
    const survivingAllies = G.units.filter((u) => u._isRaidUnit && !u._remove && !u.dying).length;
    const survivingEnemies = countAliveRaidEnemies();
    G.world.currentSystem = prevSystem;
    G.fort.hp = prevFortHp;
    if (skills2) {
      G.skills = prevSkills;
      applyAll();
    }
    C.formationMult = prevFormationMult;
    restoreCombat(snap);

  // src/ui/icon-line.ts
  var SPRITE = { "\u25CF": "ui-icon-coin", "\u{1F48E}": "ui-icon-emerald" };
  function createIconLine(str, x, cy, o) {
    const scene = ctx.scene;
    const iconSz = o.iconSize ?? 18;
    const originX = o.originX ?? 0.5;
    const alpha = o.alpha ?? 1;
    const depth = o.depth;
    const tokens = str.split(/(●|💎)/u).filter((s) => s !== "");
    const pieces = [];
    for (const tok of tokens) {
      if (SPRITE[tok]) {
        const img = scene.add.image(0, cy, SPRITE[tok]).setOrigin(0, 0.5).setDisplaySize(iconSz, iconSz);
        pieces.push({ obj: img, w: iconSz });
      } else {
        const txt = scene.add.text(
          0,
          cy,
          tok,
          { color: o.color, fontFamily: "monospace", fontSize: o.fontSize, ...o.fontStyle ? { fontStyle: o.fontStyle } : {} }
        ).setOrigin(0, 0.5);
        pieces.push({ obj: txt, w: txt.width });
      }
    }
    const width = pieces.reduce((s, p) => s + p.w, 0);
    let cur = x - originX * width;
    const objects = [];
    for (const p of pieces) {
      p.obj.x = cur;
      p.obj.setDepth(depth).setScrollFactor(0).setAlpha(alpha);
      registerUIObject(p.obj);
      objects.push(p.obj);
      cur += p.w;
    }
    return {
      objects,
      width,
      setVisible(v) {
        for (const ob of objects) ob.setVisible(v);
      },
      destroy() {
        for (const ob of objects) ob.destroy();
        objects.length = 0;
      }
    };
  }

    if (!Number.isFinite(shown)) return target;
    if (shown === target) return target;
    const ts = Math.max(1, G.timeScale || 1);
    const frac = Math.min(1, BASE_FRAC * ts);
    const diff = target - shown;
    let next = shown + diff * frac;
    if (Math.abs(target - next) < 1) return target;
    if (Math.abs(next - shown) < 1) next = shown + Math.sign(diff);

    if (r !== rc.lastInt) {
      rc.lastInt = r;
      txt.setText(fmt2 ? fmt2(r) : `${r}`);
      rc.scale = BUMP;
    }
    if (rc.scale !== 1) {
      rc.scale += (1 - rc.scale) * BUMP_EASE;
      if (Math.abs(rc.scale - 1) < 0.01) rc.scale = 1;

  var BADGE_SIZE = "16pt";
  var BADGE_DEPTH = 6;
  var BADGE_OFF_Y = -54;
  var FULL_EPS = 0.999;
  var SAG_MIN_A = 0.3;
  var PULSE_SPEED = 4;
  var _badges = {};
  var _pulse = 0;
  function buildingPos(b) {

  function updateRepairBadges(dt) {
    if (SIM_MODE) return;
    _pulse += dt * PULSE_SPEED;
    const pulseA = 0.6 + 0.4 * Math.sin(_pulse);
    for (const b of COMBAT) {
      const frac = currentBuildingAvailFrac(b);
      const inRepair = frac < FULL_EPS;
      let badge = _badges[b];
      if (badge && !badge.scene) {
        badge = void 0;
        _badges[b] = void 0;
      }
      if (inRepair) {
        if (!badge) {
          badge = addWorldObject(
            ctx.scene.add.text(0, 0, BADGE_TEXT, { fontFamily: "monospace", fontSize: BADGE_SIZE }).setOrigin(0.5).setDepth(BADGE_DEPTH)
          );
          _badges[b] = badge;
        }
        const p = buildingPos(b);
        badge.setVisible(true).setAlpha(pulseA);
        badge.x = p.x;
        badge.y = p.y + BADGE_OFF_Y;
      } else {
        badge?.setVisible(false);
      }
      const alpha = inRepair ? SAG_MIN_A + (1 - SAG_MIN_A) * frac : 1;
      for (const u of combatGuardUnits(b)) unitGfx(u).sprite?.setAlpha(alpha);
    }
  }

  function runSystems(c) {
    const idle2 = G.travelMode === "idle";
    for (const s of SYSTEMS) {
      if (s.phase === "idle" && !idle2) continue;
      if (s.phase === "travel" && idle2) continue;
      s.tick(c);
    }
  }

  function handleFortDeath() {
    if (tryConsumePresentDefenseLoss()) return;
    G.fort.hp = G.fort.hpMax;

  // src/game.ts
  var _textFactory = Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text = function(x, y, txt, style) {
    return _textFactory.call(this, x, y, txt, Object.assign({ resolution: DPR }, style || {}));
  };
  async function boot() {
    await initCrazyGames();
    initAnalytics();
    initLang();
    cgLoadingStart();
    new Phaser.Game({
      type: Phaser.AUTO,
      width: W * DPR,
      height: H * DPR,
      backgroundColor: "#3aacab",
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: { preload, create, update },
      // Cap at 60 FPS. By default Phaser drives the loop off requestAnimationFrame, which runs
      // at the monitor's refresh rate (144/240 Hz) — wasted GPU/CPU for a 2D idle game. target:60
      // only takes effect with forceSetTimeOut:true (RAF can't be throttled below the display rate).
      fps: { target: 60, forceSetTimeOut: true },
      render: { antialias: true, antialiasGL: true, pixelArt: false, roundPixels: true }
    });
  }
  void boot();
  function preload() {
    for (const p of PRELOAD) p(this);
  }
  function create() {
    ctx.scene = this;
    installGlobalTextStroke(this);
    ctx.cam = this.cameras.main;
    setupHiDPICamera(ctx.cam);
    createDroneAnimations(this);
    createEnemyAnimations(this);
    createSheepAnimations(this);
    createTreeAnimations(this);
    createMonkAnimations(this);
    initScene();
    setupUICam();
    initAudioMute();
    cgLoadingStop();
  }
  function update(time, deltaMs) {
    this.anims.globalTimeScale = G.timeScale;
    const dt = deltaMs / 1e3 * G.timeScale;
    const overlayOpen = G.mapOpen || G.skillsOpen;
    setGameplayActive(!overlayOpen && !anyModalOpen());
    const c = { time, deltaMs, dt, overlayOpen };
    runSystems(c);
  }
})();

    const type = BOOSTER_TYPES[Math.floor(Math.random() * BOOSTER_TYPES.length)];
    const qualities = ["common", "rare", "epic"];
    const quality = qualities[Math.floor(Math.random() * 3)];
    const qDef = BOOSTER_QUALITY[quality];
    const value = _rand(qDef.valMin, qDef.valMax);
    const duration = _rand(qDef.durMin, qDef.durMax);
    if (G.boosters.length >= _totalSlots()) _evictWeakest();
    const b = { id: _uid(), type, quality, value, duration, remaining: duration };
    G.boosters.push(b);
    _invalidate();
    emit("boosters:changed");
    emit("booster:received", b);
  }

  // src/ui/hp-bar.ts
  function drawHpBar(gfx, cx, by, width, frac, opts = {}) {
    if (frac >= 1) return;
    const bgColor = opts.bgColor ?? 2228224;
    const colorHigh = opts.colorHigh ?? 8969540;
    const colorMid = opts.colorMid ?? 16746547;
    const colorLow = opts.colorLow ?? 16724787;
    const height = opts.height ?? 5;
    const bw = opts.borderWidth ?? 2;
    const borderColor = opts.borderColor ?? 0;
    const barColor = frac < 0.35 ? colorLow : frac < 0.65 ? colorMid : colorHigh;
    const bx = cx - width / 2;
    const f = Math.max(0, Math.min(1, frac));
    if (bw > 0) {
      gfx.fillStyle(borderColor, 1);
      gfx.fillRect(bx - bw, by - bw, width + bw * 2, height + bw * 2);
    }
    gfx.fillStyle(bgColor, 1);
    gfx.fillRect(bx, by, width, height);
    gfx.fillStyle(barColor, 1);
    gfx.fillRect(bx, by, width * f, height);
  }

  // src/cooking.ts
  var CELL_PX = 64;
  var COOK_DURATION = 5;
  var SMOKE_TEX_KEY = "tavern_smoke";
  var SMOKE_ANIM_KEY = "tavern_smoke";
  var TAVERN_BUILDING_KEY = "building_tavern";
  var WOOD_KEY = "wood-resource";
  var MEAT_RAW_KEY = "ui-icon-meat-raw";
  var MEAT_COOKED_KEY = "ui-icon-meat-cooked";
  var _smokeCfg = null;
  var cookingArea = {
    fire: {
      x: 0,
      y: 0,
      buildingGfx: null,
      rawMeatSlot: false,
      meatSprite: null,
      woodSlot: 0,
      woodSprites: [],
      lit: false,
      smokeSprites: [],
      smokeTimer: 0,
      cookTimer: 0,
      slotMeat: { x: 0, y: 0, iconPx: 32 },
      slotWood: { x: 0, y: 0, iconPx: 32, iconGapPx: 20 },

  function preloadCookingSprites(scene) {
    const tavernCfg = getVisualConfig("tavern");
    const tavernPath = tavernCfg?.sprite ?? "assets/tiles/tinyswords/buildings/blue-buildings/tavern2.png";
    scene.load.image(TAVERN_BUILDING_KEY, tavernPath);
    const smokeVFX = tavernCfg?.vfx?.["smoke"];
    if (smokeVFX) {
      scene.load.spritesheet(SMOKE_TEX_KEY, smokeVFX.path, {
        frameWidth: smokeVFX.frameW ?? 64,
        frameHeight: smokeVFX.frameH ?? smokeVFX.frameW ?? 64
      });
    }
  }
  function createCookingAnimations(scene) {
    if (scene.anims.exists(SMOKE_ANIM_KEY)) return;
    const smokeVFX = getVisualConfig("tavern")?.vfx?.["smoke"];
    if (!smokeVFX) return;
    scene.anims.create({
      key: SMOKE_ANIM_KEY,
      frames: scene.anims.generateFrameNumbers(SMOKE_TEX_KEY, { start: 0, end: smokeVFX.frameCount - 1 }),
      frameRate: smokeVFX.frameRate ?? 5,
      repeat: 0
    });
  }
  function initCooking() {
    const shelter = G.world.fort;
    const tavernCfg = getVisualConfig("tavern");
    const baseX = shelter.x;
    const baseY = shelter.baseY + 2 * CELL_PX;
    cookingArea.fire.x = baseX + (tavernCfg?.offsetX ?? CELL_PX);
    cookingArea.fire.y = baseY + (tavernCfg?.offsetY ?? 0);
    const fSlots = tavernCfg?.slots ?? {};
    WOOD_KEY = fSlots["wood"]?.iconKey ?? WOOD_KEY;
    MEAT_RAW_KEY = fSlots["rawMeat"]?.iconKey ?? MEAT_RAW_KEY;
    MEAT_COOKED_KEY = fSlots["cookedOutput"]?.iconKey ?? MEAT_COOKED_KEY;
    cookingArea.fire.slotMeat = {
      x: cookingArea.fire.x + (fSlots["rawMeat"]?.offsetX ?? 0),
      y: cookingArea.fire.y + (fSlots["rawMeat"]?.offsetY ?? -48),
      iconPx: fSlots["rawMeat"]?.iconPx ?? 32
    };
    cookingArea.fire.slotWood = {
      x: cookingArea.fire.x + (fSlots["wood"]?.offsetX ?? 0),
      y: cookingArea.fire.y + (fSlots["wood"]?.offsetY ?? 32),
      iconPx: fSlots["wood"]?.iconPx ?? 32,
      iconGapPx: fSlots["wood"]?.iconGapPx ?? 20
    };
    cookingArea.fire.stump.pos = {
      x: cookingArea.fire.x + (fSlots["cookedOutput"]?.offsetX ?? 0),
      y: cookingArea.fire.y + (fSlots["cookedOutput"]?.offsetY ?? 56),
      iconPx: fSlots["cookedOutput"]?.iconPx ?? 32
    };
    _smokeCfg = tavernCfg?.vfx?.["smoke"] ?? null;
    const tavernScale = (tavernCfg?.displayPx ?? 128) / (tavernCfg?.spriteW ?? 256);
    cookingArea.fire.buildingGfx = addWorldObject(
      ctx.scene.add.image(cookingArea.fire.x, cookingArea.fire.y, TAVERN_BUILDING_KEY).setOrigin(0.5, 0.5).setScale(tavernScale).setDepth(3).setVisible(false)
      // hidden from map
    );
  }
  function startCooking() {
    const fire = cookingArea.fire;
    fire.lit = true;
    fire.cookTimer = 0;
    fire.smokeTimer = 0;
    fire.meatSprite?.destroy();
    fire.meatSprite = null;
    for (const s of fire.woodSprites) s.destroy();
    fire.woodSprites = [];
  }
  function spawnSmoke() {
    if (!_smokeCfg) return;
    const fire = cookingArea.fire;
    const x = fire.x + (_smokeCfg.offsetX ?? 0);
    const y = fire.y + (_smokeCfg.offsetY ?? -80);
    const px = _smokeCfg.displayPx ?? 48;
    const riseSpeed = _smokeCfg.riseSpeed ?? 30;
    const frameRate = _smokeCfg.frameRate ?? 5;
    const durMs = _smokeCfg.frameCount / frameRate * 1e3;
    const s = addWorldObject(
      ctx.scene.add.sprite(x, y, SMOKE_TEX_KEY).setDisplaySize(px, px).setDepth(5)
    );
    s.play(SMOKE_ANIM_KEY);
    s.once("animationcomplete", () => s.destroy());
    ctx.scene.tweens.add({ targets: s, y: y - riseSpeed * (durMs / 1e3), duration: durMs, ease: "Linear" });
    fire.smokeSprites.push(s);
  }
  function addWoodToFire() {
    const fire = cookingArea.fire;
    fire.woodSlot = Math.min(fire.woodSlot + 1, 2);
    for (const s of fire.woodSprites) s.destroy();
    fire.woodSprites = [];
    const px = fire.slotWood.iconPx;
    const gap = fire.slotWood.iconGapPx;
    const totalW = (fire.woodSlot - 1) * gap;
    for (let i = 0; i < fire.woodSlot; i++) {
      const ox = fire.woodSlot === 1 ? 0 : -totalW / 2 + i * gap;
      fire.woodSprites.push(addWorldObject(
        ctx.scene.add.image(fire.slotWood.x + ox, fire.slotWood.y, WOOD_KEY).setDisplaySize(px, px).setDepth(4)
      ));
    }
    if (!fire.lit && fire.woodSlot >= 2 && fire.rawMeatSlot) startCooking();
  }
  function addMeatToFire() {
    const fire = cookingArea.fire;
    fire.rawMeatSlot = true;
    fire.meatSprite?.destroy();
    const px = fire.slotMeat.iconPx;
    fire.meatSprite = addWorldObject(
      ctx.scene.add.image(fire.slotMeat.x, fire.slotMeat.y, MEAT_RAW_KEY).setDisplaySize(px, px).setDepth(4)
    );
    if (!fire.lit && fire.woodSlot >= 2) startCooking();
  }
  function finishCooking() {
    const fire = cookingArea.fire;
    fire.rawMeatSlot = false;
    fire.meatSprite?.destroy();
    fire.meatSprite = null;
    fire.lit = false;
    fire.woodSlot = 0;
    for (const s of fire.woodSprites) s.destroy();
    fire.woodSprites = [];
    const stump = fire.stump;
    const px = stump.pos.iconPx;
    const temp = addWorldObject(
      ctx.scene.add.image(fire.slotMeat.x, fire.slotMeat.y, MEAT_COOKED_KEY).setDisplaySize(px, px).setDepth(5)
    );
    ctx.scene.tweens.add({
      targets: temp,
      x: stump.pos.x,
      y: stump.pos.y,
      duration: 400,
      ease: "Cubic.easeOut",
      onComplete: () => {

        stump.cookedMeatSlot = true;

          ctx.scene.add.image(stump.pos.x, stump.pos.y, MEAT_COOKED_KEY).setDisplaySize(px, px).setDepth(4)

  function clearStump() {
    const stump = cookingArea.fire.stump;

    stump.meatSprite = null;

  function updateCooking(dt, overlayOpen) {
    const fire = cookingArea.fire;
    const vis = !overlayOpen;
    cookingArea.fire.meatSprite?.setVisible(vis);
    cookingArea.fire.stump.meatSprite?.setVisible(vis);
    for (const s of cookingArea.fire.woodSprites) s.setVisible(vis);
    fire.smokeSprites = fire.smokeSprites.filter((s) => s.active);
    for (const s of fire.smokeSprites) s.setVisible(vis);
    if (!fire.lit) return;
    fire.cookTimer += dt;
    if (fire.cookTimer >= COOK_DURATION) {
      finishCooking();
      return;
    }
    if (!overlayOpen) {
      const interval = _smokeCfg?.spawnInterval ?? 0.5;
      fire.smokeTimer += dt;
      if (fire.smokeTimer >= interval) {
        fire.smokeTimer -= interval;
        spawnSmoke();
      }
    }
  }

  // src/repair.ts
  function countRepairing() {
    let n = 0;
    for (const d of G.units) if (d.state === "REPAIRING" || d.state === "TO_FORT_REPAIR") n++;
    return n;
  }
  function maxRepairers() {
    let n = 0;
    if (G.fort.level > 0) n++;
    if (G.tavern.level > 0) n++;
    if (G.jewelryWorkshop.level > 0) n++;
    if (G.lumberjackHouse.level > 0) n++;
    return n;
  }
  function shouldRepair() {
    if (G.fort.hp >= G.fort.hpMax) return false;
    return countRepairing() < maxRepairers();
  }
  function shouldKeepRepairing(_d) {
    return G.fort.hp < G.fort.hpMax;
  }
  function getRepairRate() {
    let repairers = 0;
    for (const d of G.units)
      if (d.state === "REPAIRING") repairers += 1;
    const hpPerSec = G.fort.hpMax * C.fortRepairHpPercent / 100 / C.fortRepairDuration;
    return repairers * hpPerSec * getDefenceMultiplier();
  }
  function updateRepair(dt) {
    if (G.fort.hp >= G.fort.hpMax) return;
    const rate = getRepairRate();
    if (rate > 0) G.fort.hp = Math.min(G.fort.hpMax, G.fort.hp + rate * dt);
  }

  // src/units/states/to-sheep.ts
  function tickToSheep(d, dt) {
    const sheep = d.targetSheep;
    if (!sheep || sheep.state !== "alive") {
      d.targetSheep = null;
      d.state = "IDLE";
      return;
    }
    const len = d.curve.getLength();
    d.t += C.unitSpeedPx * getUnitsMultiplier() * getMul("units") * 0.5 * dt / Math.max(len, 1);
    if (d.t >= 1) {
      const { sx, sy } = sheepScreenPos(sheep);
      d.x = d._sheepSideX ?? sx + 40;
      d.y = d._sheepSideY ?? sy - SHEEP_DISPLAY_PX * 0.5;
      d.state = "HARVEST_SHEEP";
      d.timer = C.harvestSheepDuration;
      d.t = 0;
    } else {
      const p = d.curve.getPoint(d.t);
      d.x = p.x;
      d.y = p.y;
    }
  }
  function makeToSheepCurve(d, sheep) {
    const { sx, sy } = sheepScreenPos(sheep);
    const centerY = sy - SHEEP_DISPLAY_PX * 0.5;
    const sideX = Math.random() < 0.5 ? sx + 40 : sx - 40;
    d._sheepSideX = sideX;
    d._sheepSideY = centerY;
    d.curve = makeCurve({ x: d.x, y: d.y }, { x: sideX, y: centerY }, pickRoute());
  }

  function tickToShelterRepair(d, dt) {
    if (G.fort.hp >= G.fort.hpMax) {

    if (d.t >= 1) {
      const totalPeasants = G.units.filter((u) => u.unitType.startsWith("peasant")).length;
      const slotAngle = (d.repairSlotIndex ?? 0) * (Math.PI * 2 / Math.max(totalPeasants, 1));
      d.repairTargetX = G.world.fort.x + Math.cos(slotAngle) * C.peasantShipOrbitRadius;
      d.repairTargetY = G.world.fort.y + Math.sin(slotAngle) * C.peasantShipOrbitRadius;

    const angle = Math.random() * Math.PI * 2;
    const tx = s.x + Math.cos(angle) * C.peasantShipOrbitRadius;
    const ty = s.y + Math.sin(angle) * C.peasantShipOrbitRadius;
    d.t = 0;
    d.curve = makeCurve({ x: d.x, y: d.y }, { x: tx, y: ty }, pickRoute());

  // src/units/states/idle.ts
  function _advanceExhausted(d) {
    if (!d.tripCounters) return;
    const order = d.tripOrder;
    const counters = d.tripCounters;
    if (counters[order[d.tripIdx]] > 0) return;
    for (let i = 1; i < order.length; i++) {
      const idx = (d.tripIdx + i) % order.length;
      if (counters[order[idx]] > 0) {
        d.tripIdx = idx;
        return;
      }
    }
    const defs = d.tripDefaults;
    for (const k of order) counters[k] = defs[k];
    d.tripIdx = 0;
  }
  function _pickGatherTarget(d) {
    if (!d.tripCounters) return false;
    _advanceExhausted(d);
    const order = d.tripOrder;
    const counters = d.tripCounters;
    for (let i = 0; i < order.length; i++) {
      const resource = order[(d.tripIdx + i) % order.length];
      if (counters[resource] === 0) continue;
      switch (resource) {
        case "rawMeat": {
          const sheep = findUnclaimedSheep();
          if (sheep) {
            claimSheep(sheep, d);
            d.targetSheep = sheep;
            d.t = 0;
            d.state = "TO_SHEEP";
            makeToSheepCurve(d, sheep);
            return true;
          }
          break;
        }
        case "wood": {
          const tree = findUnclaimedTree();
          if (tree) {
            claimTree(tree, d);
            d.targetTree = tree;
            d.t = 0;
            d.state = "TO_TREE";
            makeToTreeCurve(d, tree);
            return true;
          }
          break;
        }
        case "gold": {
          if (miningInRange()) {
            pickMiningAsteroid(d);
            const ma = d.activeAsteroid;
            if (ma && !ma.isBuoy && ma.hp > 0) {
              const mt = getMiningTarget(d);
              if (mt) {
                d.state = "TO_ASTEROID";
                d.t = 0;
                d.miningTarget = mt;
                d.curve = makeCurve({ x: d.x, y: d.y }, mt, pickRoute());
                return true;
              }
            }
          }
          break;
        }
      }
    }
    return false;
  }
  function tickIdle(d, dt) {
    if (UNIT_TIERS[d.unitType]?.role === "lancer" || UNIT_TIERS[d.unitType]?.role === "warrior") {
      const tgt = findLancerTarget();
      if (tgt) {
        d.target = tgt;
        d.chaseTimer = 0;
        d.state = "INTERCEPTING";
      }
      return;
    }
    if (UNIT_TIERS[d.unitType]?.role === "archer") {
      if (d._archerAttacking) return;
      const home = unitHomePos(d);
      const hdx = home.x - d.x, hdy = home.y - d.y;
      const hdist = Math.hypot(hdx, hdy);
      if (hdist > 8) {
        const spd = 80;
        d.x += hdx / hdist * spd * dt;
        d.y += hdy / hdist * spd * dt;
      }
      const archerInterval = UNIT_TIERS[d.unitType]?.fireInterval ?? 1;
      d.fireTimer += dt;
      if (d.fireTimer < archerInterval / getDefenceMultiplier()) return;
      const hasTgt = G.combat.enemies.some((e) => !e.dead && isOnIsland(e.x, e.y)) || G.combat.meteors.some((m) => isOnIsland(m.x, m.y));
      if (hasTgt) {
        d.state = "ARCHER_GUARD";
      }
      return;
    }
    if (shouldRepair()) {
      d.repairSlotIndex = G.units.filter((u) => u !== d && (u.state === "REPAIRING" || u.state === "TO_FORT_REPAIR")).length;
      makeToShelterRepairCurve(d);
      d.state = "TO_FORT_REPAIR";
      return;
    }
    if (G.tavern.level > 0) {
      const fire = cookingArea.fire;
      if (fire.stump.cookedMeatSlot && !G.units.some((u) => u !== d && u.state === "TO_STUMP")) {
        d.t = 0;
        makeToStumpCurve(d);
        d.state = "TO_STUMP";

      spawnRaidEnemy("Torch");
    } else {

      spawnRaidEnemy("Dancer");

    if (G.eco.coins < cost) {

  function startTravel() {

    const { obj, jpIdx } = G.selected;
    const jp = obj.jumpPoints[jpIdx];
    const tx = obj.x + jp.dx, ty = obj.y + jp.dy;
    const ox = G.world.currentSystem?.x ?? G.world.fort.x;
    const oy = G.world.currentSystem?.y ?? G.world.fort.baseY;
    const dist = Math.hypot(tx - ox, ty - oy);
    const sameObject = obj === G.world.currentSystem;
    G.travelTarget = { obj, jpIdx, x: tx, y: ty, distance: dist, cost: 0, sameObject };
    if (!sameObject) {
      clearMeteors();
      clearEnemies();
      closeRaidUI();
    }

    if (G.world.fort.waypointMarker) {
      G.world.fort.waypointMarker.destroy();
      G.world.fort.waypointMarker = null;
    }

    G.travelMode = "fadeOut";
    G.travelTimer = C.travelFade;

          d.target = null;

        if ((dest.type === "Cache" || dest.type === "Derelict") && !dest.looted) {

        } else if (dest.type === "Turret") {

        } else if (dest.type === "Anomaly") {
          if (Math.random() >= 0.5) {

          }

        if (G.world.fort.cameraTarget) {

          G.world.fort.cameraTarget.y = G.world.fort.baseY;

        ctx.cam.centerOn(G.world.fort.x, G.world.fort.y);

  // src/input.ts
  function setupInput() {
    const scene = ctx.scene;
    const cam = ctx.cam;
    let camDragStartX = 0;
    let camDragStartY = 0;
    function clampCam() {
      const sys = G.world.currentSystem;
      if (!sys) return;
      const vis = getIslandVisual(sys.tileAsset ?? DEFAULT_TILE_ASSET);
      const tw = vis?.displayTileW ?? 64;
      const limit = C.camPanTiles * tw;
      const hw = cam.width / (2 * cam.zoom);
      const hh = cam.height / (2 * cam.zoom);
      cam.scrollX = Phaser.Math.Clamp(cam.scrollX, sys.x - limit - hw, sys.x + limit - hw);
      cam.scrollY = Phaser.Math.Clamp(cam.scrollY, sys.y - limit - hh, sys.y + limit - hh);
    }
    scene.input.on("pointermove", (ptr) => {
      ctx.lastPtr = ptr;
      if (G.mapOpen) {
        if (ptr.isDown) {
          const { x, y } = ptrXY(ptr);
          updateMapDrag(x, y);
        }
        return;
      }
      if (ptr.isDown && !G.skillsOpen && !drag.gameObjectClicked) {
        cam.scrollX = camDragStartX + (ptr.downX - ptr.x) / cam.zoom;
        cam.scrollY = camDragStartY + (ptr.downY - ptr.y) / cam.zoom;
        clampCam();
      }
    });
    scene.input.on("pointerdown", () => {
      closeAllUnitTypePopups();
      camDragStartX = cam.scrollX;
      camDragStartY = cam.scrollY;
    });
    scene.input.on("pointerup", () => {
      stopActiveAutoClicker();
      drag.gameObjectClicked = false;
      if (G.mapOpen) handleMapBgRelease();
    });
    scene.input.on(
      "wheel",
      (ptr, _gos, _dx, deltaY) => {
        if (G.skillsOpen) return;
        if (G.mapOpen) {
          const { x, y } = ptrXY(ptr);
          handleMapWheel(x, y, deltaY);
          return;
        }
        const worldPt = cam.getWorldPoint(ptr.x, ptr.y);
        const newZoom = cam.zoom - cam.zoom * 1e-3 * deltaY;
        cam.zoom = Phaser.Math.Clamp(newZoom, DPR * 0.5, DPR * 2);
        ctx.userZoom = cam.zoom / DPR;
        cam.preRender();
        const newWorldPt = cam.getWorldPoint(ptr.x, ptr.y);
        cam.scrollX -= newWorldPt.x - worldPt.x;
        cam.scrollY -= newWorldPt.y - worldPt.y;
        camDragStartX = cam.scrollX;
        camDragStartY = cam.scrollY;
        clampCam();
      }
    );
    scene.input.keyboard.on("keydown-SPACE", () => {
      if (G.mapOpen && G.world.mapGridActive) {
        mapGridStep();
        return;
      }
      simulateLMB();
    });
    scene.input.keyboard.on("keyup-SPACE", () => {
      stopActiveAutoClicker();
    });
    scene.input.keyboard.on("keydown-M", () => toggleMap());
    scene.input.keyboard.on("keydown-T", () => toggleSkills());
    scene.input.keyboard.on("keydown-ESC", () => {
      if (HUD.resetPopup?.all[0]?.visible) {
        closeResetPopup();
        return;
      }
      if (G.mapOpen) closeMap();
      if (G.skillsOpen) closeSkills();
    });
  }
  function simulateLMB() {
    const ptr = ctx.lastPtr;
    if (!ptr) return;
    if (G.mapOpen) {
      const { x, y } = ptrXY(ptr);
      for (const z of HUD.map?.clickZones || []) {
        if (Math.abs(x - z.sx) <= z.sz && Math.abs(y - z.sy) <= (z.szY ?? z.sz)) {
          z.cb();
          return;
        }
      }
      return;
    }
    const wx = ptr.worldX, wy = ptr.worldY;
    if (G.world.fort.clickInteract && Math.hypot(wx - G.world.fort.x, wy - G.world.fort.baseY) <= 20) {
      G.world.fort.clickInteract.start();
      return;
    }
    for (const o of G.world.localObjects) {
      if (!o.clickInteract || !o.gfx?.visible) continue;
      if (Math.hypot(wx - o.x, wy - o.y) <= Math.max(20, o.r || 8)) {
        o.clickInteract.start();
        return;
      }
    }
  }

  // src/refinery.ts
  function getRefiningTier() {
    for (const t of ["T3", "T2", "T1"]) if (G.eco.cargo[t] > 0) return t;
    return null;
  }
  function getRefineTime(tier) {
    const base = tier === "T2" ? C.refineDuration * 1.3 : tier === "T3" ? C.refineDuration * 1.6 : C.refineDuration;
    return base / getMul("mining");
  }
  function updateRefinery(dt) {
    const tier = getRefiningTier();
    if (!tier) {
      G.eco.refineTimer = 0;
      return;
    }
    G.eco.refineTimer += dt * getBoostMultiplier();
    if (G.eco.refineTimer >= getRefineTime(tier)) {
      G.eco.refineTimer = 0;
      G.eco.cargo[tier] -= 1;
      G.eco.cargoTotal -= 1;
    }
  }

  // src/jump-points.ts
  function updateJumpPointVisuals() {
    for (const o of G.world.localObjects) {
      drawHpRing(o);
    }
    for (const s of G.world.systems) {
      s.hpRing?.clear();
    }
  }
  function drawHpRing(o) {
    if (!o.hpRing) return;
    o.hpRing.clear();
    if (!o.gfx?.visible) return;
    const sys = G.world.currentSystem;
    const cx = sys?.x ?? 0, cy = sys?.y ?? 0;
    const BAR_W = 40;
    if (o.type === "Asteroid" && !o.isBuoy && o.hp > 0) {
      const { sx, sy } = isoProject(o.x, o.y, cx, cy);
      const r = o.rOriginal ?? o.r;
      drawHpBar(o.hpRing, sx, sy + r + 6, BAR_W, o.hp / o.hpMax);
    } else if (o.type === "Debris" && o.debrisState === "alive" && o.hp > 0) {
      const { sx, sy } = isoProject(o.x, o.y, cx, cy);
      const r = o.displayR ?? o.rOriginal;
      drawHpBar(o.hpRing, sx, sy + r + 6, BAR_W, o.hp / o.hpMax);
      const timeFrac = o.debrisTimerMax > 0 ? Math.max(0, o.debrisTimer / o.debrisTimerMax) : 1;
      drawHpBar(o.hpRing, sx, sy + r + 20, BAR_W, timeFrac, {
        height: 3,
        borderWidth: 1,
        bgColor: 4386,
        colorHigh: 4508927,
        colorMid: 16763972,
        colorLow: 16733508
      });
    }
  }

  // src/monk.ts
  var _sprite = null;
  function preloadMonkSprite(scene) {
    const cfg = getVisualConfig("monk");
    for (const [key, def] of Object.entries(cfg?.animations ?? {})) {
      scene.load.spritesheet(key, def.path, {
        frameWidth: def.frameW ?? cfg?.spriteW ?? 192,
        frameHeight: def.frameH ?? def.frameW ?? cfg?.spriteW ?? 192
      });
    }
  }
  function createMonkAnimations(scene) {
    const cfg = getVisualConfig("monk");
    for (const [key, def] of Object.entries(cfg?.animations ?? {})) {
      if (!scene.anims.exists(key)) {
        scene.anims.create({
          key,
          frames: scene.anims.generateFrameNumbers(key, { start: 0, end: def.frameCount - 1 }),
          frameRate: def.frameRate ?? 8,
          repeat: def.repeat ?? -1
        });
      }
    }
  }
  function updateMonk(overlayOpen) {
    _sprite?.setVisible(!overlayOpen);
  }

  // src/tutorial.ts
  var jpHintDone = false;
  var _marker = null;
  function _createJumpHint() {
    const scene = ctx.scene;
    const x = W - 54, y = H / 2 - 42;
    const ring = scene.add.circle(x, y, 11, 0, 0).setStrokeStyle(2, 16768341).setScrollFactor(0).setDepth(99);
    registerUIObject(ring);
    const label = scene.add.text(
      x,
      y,
      "!",
      { color: "#ffdd55", fontFamily: "monospace", fontSize: "14pt", fontStyle: "bold" }
    ).setOrigin(0.5).setScrollFactor(0).setDepth(99);
    registerUIObject(label);
    const proxy = { s: 1 };
    const tween = scene.tweens.add({
      targets: proxy,
      s: 1.5,
      duration: 550,
      yoyo: true,
      repeat: -1,
      ease: "Sine.easeInOut",
      onUpdate: () => {
        ring.setScale(proxy.s);
        label.setScale(proxy.s);
      }
    });
    return {
      destroy() {
        tween.stop();
        scene.tweens.add({
          targets: [ring, label],
          alpha: 0,
          duration: 200,
          ease: "Cubic.easeIn",
          onComplete: () => {
            ring.destroy();
            label.destroy();
          }
        });
      }
    };
  }
  function checkTutorial() {
    if (!jpHintDone && G.eco.coins >= 3) {
      jpHintDone = true;
      G.showMapHint = true;
    }
    if (G.showMapHint && !G.mapHintSeen && !_marker)
      _marker = _createJumpHint();
    if (G.mapHintSeen && _marker) {
      _marker.destroy();
      _marker = null;
    }
  }

  // src/death.ts
  function handleFortDeath() {
    const insuranceLvl = G.skills["insurance"] || 0;
    G.eco.coins = Math.round(G.eco.coins * insuranceLvl * 0.1);
    G.eco.cargo = { T1: 0, T2: 0, T3: 0 };
    G.eco.cargoTotal = 0;
    G.eco.refineTimer = 0;
    G.upgrades = {};
    applyAll();
    if (G.world.currentSystem?.zone === "Cyan")
      ctx.scene.time.delayedCall(0, () => {
        clearEnemies();
        resetEnemyTimers();
      });
    for (const d of G.units) {
      d.oreDot?.destroy();
      d.hpBarGfx?.destroy();
      d.destroy();
    }
    G.units.length = 0;
    clearMeteors();
    G.fort.hp = G.fort.hpMax;
    if (G.world.currentSystem) G.world.currentSystem.localState = null;
    destroyLocalObjects();
    const home = G.world.systems[0];
    const hjp = home.jumpPoints[0];
    G.world.fort.x = home.x + hjp.dx;
    G.world.fort.y = home.y + hjp.dy;
    G.world.fort.baseY = G.world.fort.y;
    G.world.fort.gfx.x = G.world.fort.x;
    G.world.fort.gfx.y = G.world.fort.y;
    G.world.currentSystem = home;
    G.tower.x = G.world.fort.x + G.tower.dx;
    G.tower.y = G.world.fort.baseY + G.tower.dy;
    G.archery.x = G.world.fort.x + G.archery.dx;
    G.archery.y = G.world.fort.baseY + G.archery.dy;
    G.barracks.x = G.world.fort.x + G.barracks.dx;
    G.barracks.y = G.world.fort.baseY + G.barracks.dy;
    G.tavern.x = G.world.fort.x + G.tavern.dx;
    G.tavern.y = G.world.fort.baseY + G.tavern.dy;
    G.garrison.length = 0;
    syncGarrisonToLevel();
    syncTowerGarrison();
    syncArcheryGarrison();
    syncBarracksGarrison();
    syncTavernGarrison();
    syncJewelryWorkshopGarrison();
    syncLumberjackHouseGarrison();
    initLocalObjects(home);
    renderLocalObjects();
    if (G.world.fort.cameraTarget) {
      G.world.fort.cameraTarget.x = G.world.fort.x;
      G.world.fort.cameraTarget.y = G.world.fort.baseY;
    }
    ctx.cam.centerOn(G.world.fort.x, G.world.fort.y);
    pickActiveAsteroid();
    saveGame();
    G.combat.deathFlash = 1;
    fadeTo(0.7, 0.15);
    ctx.scene.time.delayedCall(160, () => fadeTo(0, 0.5));
  }
  on("fort:death", handleFortDeath);

  // src/game.ts
  var _textFactory = Phaser.GameObjects.GameObjectFactory.prototype.text;

    type: Phaser.AUTO,

  function update(time, deltaMs) {
    this.anims.globalTimeScale = G.timeScale;
    const dt = deltaMs / 1e3 * G.timeScale;
    const overlayOpen = G.mapOpen || G.skillsOpen;
    updateFort(time, overlayOpen);
    updateTower(overlayOpen);
    updateLighthouse(overlayOpen);
    updateArchery(overlayOpen);
    updateBarracks(overlayOpen);
    updateTavern(overlayOpen);
    updateLumberjackHouse(overlayOpen);
    updateJewelryWorkshop(overlayOpen);
    updateMonk(overlayOpen);
    updateCooking(dt, overlayOpen);
    if (G.combat.deathFlash > 0)
      G.combat.deathFlash = Math.max(0, G.combat.deathFlash - dt * 2);
    updateBoosters(dt);
    updateRewardBooster(dt);
    updateBoostersTimers(dt);
    if (G.travelMode === "idle") {
      updateGridMap(dt);
      updateUnits(dt);
      updateGarrison(dt);
      updateTowerGarrison(dt);
      updateArcheryGarrison(dt);
      updateBarracksGarrison(dt);
      updateTavernGarrison(dt);
      updateJewelryGarrison(dt);
      updateLumberjackGarrison(dt);
      updateRefinery(dt);
      updateBuoyIncome(dt);
      updateJunk(dt);
      updateMeteors(dt);
      updateEnemies(dt);
      updateTentacles(dt);
      updateRepair(dt);
      updateBoost(dt);
      updateBeacons(dt);
      updateDebris(dt);
      updateSheep(dt);
      updateTrees(dt);
      tickAsteroidTimers(dt);
      updateIncome(dt);
      tickRaidIsland(dt);
      const raidFired = updateRaidTimers(dt);
      if (raidFired && G.world.currentSystem) {
        spawnRaidWave(G.world.currentSystem.zone);
        const rt = ctx.scene.add.text(
          W / 2,
          H * 0.35,
          "\u2694  RAID!",
          { color: "#ff4422", fontFamily: "monospace", fontSize: "22pt", fontStyle: "bold" }
        ).setScrollFactor(0).setDepth(198).setOrigin(0.5);
        ctx.scene.tweens.add({
          targets: rt,
          y: rt.y - 50,
          alpha: 0,
          duration: 2e3,
          onComplete: () => rt.destroy()
        });
      }
    } else {
      updateTravel(dt);
    }
    updateSystemThreat(dt);
    updateBackground(dt);
    updateDroneRangeCircle();
    G.autoSaveTimer += dt;
    if (G.autoSaveTimer >= AUTOSAVE_INTERVAL) {
      G.autoSaveTimer = 0;
      if (G.world.currentSystem) G.world.currentSystem.localState = serializeLocalState();
      saveGame();
    }
    updateAsteroidSizes();
    updateLocalVisibility();
    updateFog();
    updateJumpPointVisuals();
    tickLocalInteracts(dt);
    tickFortInteract(dt);
    checkTutorial();
    tickFortUpgradeWidget(dt);
    tickTowerUpgradeWidget(dt);
    tickLighthouseUpgradeWidget(dt);
    tickArcheryUpgradeWidget(dt);
    tickBarracksUpgradeWidget(dt);
    tickTavernUpgradeWidget(dt);
    tickLumberjackHouseUpgradeWidget(dt);
    tickJewelryWorkshopUpgradeWidget(dt);
    updateHUD();
    drawMap();
  }
})();
